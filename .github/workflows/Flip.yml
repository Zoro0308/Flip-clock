                      if (mode == ClockPrefs.MODE_TRANS_LIGHT_TEXT) {
                          canvas.drawColor(Color.parseColor("#1E293B"));
                      } else if (mode == ClockPrefs.MODE_TRANS_DARK_TEXT) {
                          canvas.drawColor(Color.parseColor("#E2E8F0"));
                      }
                      renderer.drawClock(
                              canvas,
                              getWidth(),
                              getHeight(),
                              System.currentTimeMillis(),
                              mode,
                              ClockPrefs.isShowMsBox(getContext()),
                              ClockPrefs.isUse24Hour(getContext()),
                              ClockPrefs.POS_CENTER,
                              (mode == ClockPrefs.MODE_AMOLED_DARK || mode == ClockPrefs.MODE_WHITE_LIGHT),
                              0f,
                              0f
                      );
                  }
              }
          }
          EOF_FILE

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Signed APK
        working-directory: flip_clock_build
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RealmeFlipOdometerClock.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: RealmeFlipOdometerClock-APK
          path: RealmeFlipOdometerClock.apk
          if-no-files-found: error
