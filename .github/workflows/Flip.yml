          package com.realme.flipclock;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.util.Log;
          
          public class BootCompletedReceiver extends BroadcastReceiver {
          
              private static final String TAG = "BootCompletedReceiver";
          
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (context == null || intent == null || intent.getAction() == null) {
                      return;
                  }
                  String action = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(action)
                          || Intent.ACTION_LOCKED_BOOT_COMPLETED.equals(action)
                          || Intent.ACTION_MY_PACKAGE_REPLACED.equals(action)) {
                      Log.i(TAG, "System event received (" + action + "); refreshing flip clock widgets if active.");
                      if (FlipWidgetService.hasActiveWidgets(context)) {
                          FlipOdometerWidgetProvider.tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                          FlipWidgetService.ensureRunning(context);
                      }
                  }
              }
          }
