              private String buildDynamicDeviceSubtitle() {
                  String manufacturer = Build.MANUFACTURER != null ? Build.MANUFACTURER.trim() : "";
                  String model = Build.MODEL != null ? Build.MODEL.trim() : "Android Device";
                  String deviceName;
                  if (model.toLowerCase(Locale.US).startsWith(manufacturer.toLowerCase(Locale.US))) {
                      deviceName = capitalizeFirst(model);
                  } else {
                      deviceName = capitalizeFirst(manufacturer) + " " + model;
                  }
                  return deviceName + " (Android " + Build.VERSION.RELEASE + " â€¢ API " + Build.VERSION.SDK_INT + ")";
              }
          
              private String capitalizeFirst(String s) {
                  if (s == null || s.isEmpty()) return "";
                  return Character.toUpperCase(s.charAt(0)) + s.substring(1);
              }
          
              private void refreshAll() {
                  FlipOdometerWidgetProvider.updateAllWidgets(this);
                  previewView.triggerImmediateFrame();
                  refreshStatus();
              }
          
