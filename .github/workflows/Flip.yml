              private void refreshStatus() {
                  String[] modeNames = {"AMOLED Dark", "White Mode", "Transparent (Light)", "Transparent (Dark)"};
                  String[] posNames = {"Top", "Center", "Bottom"};
                  int m = ClockPrefs.getThemeMode(this);
                  boolean h24 = ClockPrefs.isUse24Hour(this);
                  int pos = ClockPrefs.getVerticalPos(this);
                  boolean hasBg = ClockPrefs.hasCustomBackground(this);
                  statusLabel.setText(
                          "Active: " + modeNames[m]
                          + (hasBg ? " + Custom Gallery Photo" : "")
                          + " â€¢ " + (h24 ? "24-Hour" : "12-Hour AM/PM")
                          + " â€¢ Pos: " + posNames[pos]
                  );
              }
          
              private void openLiveWallpaperPicker() {
                  try {
                      Intent intent = new Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);
                      intent.putExtra(
                              WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                              new ComponentName(this, FlipOdometerWallpaperService.class)
                      );
                      startActivity(intent);
                  } catch (Exception e) {
                      try {
                          Intent fallback = new Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER);
                          startActivity(fallback);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Long-press Home Screen -> Wallpapers -> Live Wallpapers", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          
              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }
          
              private static class LivePreviewView extends View implements Choreographer.FrameCallback {
          
                  private final FlipOdometerRenderer renderer = new FlipOdometerRenderer();
                  private boolean active = false;
          
                  public LivePreviewView(Context context) {
                      super(context);
                  }
          
                  public void start() {
                      if (!active) {
                          active = true;
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  }
          
                  public void stop() {
                      active = false;
                      Choreographer.getInstance().removeFrameCallback(this);
                  }
          
                  @Override
                  public void doFrame(long frameTimeNanos) {
                      if (!active) {
                          return;
                      }
                      invalidate();
                      Choreographer.getInstance().postFrameCallback(this);
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int mode = ClockPrefs.getThemeMode(getContext());
                      if (!ClockPrefs.hasCustomBackground(getContext())) {
                          if (mode == ClockPrefs.MODE_TRANS_LIGHT_TEXT) {
                              canvas.drawColor(Color.parseColor("#1E293B"));
                          } else if (mode == ClockPrefs.MODE_TRANS_DARK_TEXT) {
                              canvas.drawColor(Color.parseColor("#E2E8F0"));
                          }
                      }
                      renderer.drawClock(
                              getContext(),
                              canvas,
                              getWidth(),
                              getHeight(),
                              System.currentTimeMillis(),
                              mode,
                              ClockPrefs.isUse24Hour(getContext()),
                              ClockPrefs.POS_CENTER,
                              false,
                              0f,
                              0f
                      );
                  }
              }
          }
