          package com.realme.flipclock;
          
          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.Choreographer;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.widget.Toast;
          
          public class FullScreenClockActivity extends Activity {
          
              private static final String TAG = "FullScreenClock";
              private LiveFlipClockView clockView;
              private boolean receiverRegistered = false;
          
              private final BroadcastReceiver timeChangeReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (clockView != null) {
                          clockView.triggerImmediateFrame();
                      }
                  }
              };
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WALLPAPER);
                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
          
                  clockView = new LiveFlipClockView(this);
                  setContentView(clockView);
                  hideSystemBars();
                  Toast.makeText(this, "Tap screen to cycle Dark / White / Transparent modes", Toast.LENGTH_SHORT).show();
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemBars();
                  if (!receiverRegistered) {
                      try {
                          IntentFilter filter = new IntentFilter();
                          filter.addAction(Intent.ACTION_TIME_CHANGED);
                          filter.addAction(Intent.ACTION_TIMEZONE_CHANGED);
                          filter.addAction(Intent.ACTION_DATE_CHANGED);
                          registerReceiver(timeChangeReceiver, filter);
                          receiverRegistered = true;
                      } catch (Exception e) {
                          Log.w(TAG, "Failed to register time change receiver", e);
                      }
                  }
                  clockView.startAnimation();
              }
          
              @Override
              protected void onPause() {
                  clockView.stopAnimation();
                  if (receiverRegistered) {
                      try {
                          unregisterReceiver(timeChangeReceiver);
                      } catch (Exception e) {
                          Log.w(TAG, "Failed to unregister time change receiver", e);
                      }
                      receiverRegistered = false;
                  }
                  super.onPause();
              }
          
              private void hideSystemBars() {
                  WindowInsetsController controller = getWindow().getInsetsController();
                  if (controller != null) {
                      controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                      controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              }
          
              private static class LiveFlipClockView extends View implements Choreographer.FrameCallback {
          
                  private final FlipOdometerRenderer renderer = new FlipOdometerRenderer();
                  private final Handler handler = new Handler(Looper.getMainLooper());
                  private boolean running = false;
          
                  private final Runnable wakeupRunnable = new Runnable() {
                      @Override
                      public void run() {
                          handler.removeCallbacks(this);
                          if (!running) return;
                          Choreographer.getInstance().removeFrameCallback(LiveFlipClockView.this);
                          Choreographer.getInstance().postFrameCallback(LiveFlipClockView.this);
                      }
                  };
          
                  public LiveFlipClockView(Context context) {
                      super(context);
                  }
          
                  public void startAnimation() {
                      running = true;
                      triggerImmediateFrame();
                  }
          
                  public void stopAnimation() {
                      running = false;
                      handler.removeCallbacksAndMessages(null);
                      Choreographer.getInstance().removeFrameCallback(this);
                  }
          
                  public void triggerImmediateFrame() {
                      handler.removeCallbacks(wakeupRunnable);
                      Choreographer.getInstance().removeFrameCallback(this);
                      if (running) {
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  }
          
                  @Override
                  public void doFrame(long frameTimeNanos) {
                      if (!running) {
                          return;
                      }
                      invalidate();
                      long now = System.currentTimeMillis();
                      Context ctx = getContext();
                      long nextDelay = FlipOdometerRenderer.computeNextFrameDelayMs(
                              now,
                              ClockPrefs.getFlipDurationMs(ctx),
                              ClockPrefs.isShowSeconds(ctx),
                              ClockPrefs.isBatterySaverMode(ctx)
                      );
                      handler.removeCallbacks(wakeupRunnable);
                      Choreographer.getInstance().removeFrameCallback(this);
                      if (nextDelay <= 0L) {
                          Choreographer.getInstance().postFrameCallback(this);
                      } else {
                          handler.postDelayed(wakeupRunnable, nextDelay);
                      }
                  }
          
                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          int next = ClockPrefs.cycleThemeMode(getContext());
                          String[] names = {
                              "AMOLED Dark Mode",
                              "White / Light Mode",
                              "Transparent (White Digits)",
                              "Transparent (Dark Digits)"
                          };
                          Toast.makeText(getContext(), names[next], Toast.LENGTH_SHORT).show();
                          triggerImmediateFrame();
                          return true;
                      }
                      return super.onTouchEvent(event);
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      long now = System.currentTimeMillis();
                      Context ctx = getContext();
                      int theme = ClockPrefs.getThemeMode(ctx);
                      boolean use24h = ClockPrefs.isUse24Hour(ctx);
                      float shiftX = ClockPrefs.getAmoledShiftX(ctx, now);
                      float shiftY = ClockPrefs.getAmoledShiftY(ctx, now);
          
                      renderer.drawClock(
                              ctx,
                              canvas,
                              getWidth(),
                              getHeight(),
                              now,
                              theme,
                              use24h,
                              ClockPrefs.POS_CENTER,
                              false,
                              shiftX,
                              shiftY
                      );
                  }
              }
          }
