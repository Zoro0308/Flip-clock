      - name: Decode Optional Release Keystore from GitHub Secrets
        working-directory: flip_clock_build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "SIGNING_KEYSTORE_PATH=$PWD/release-keystore.jks" >> $GITHUB_ENV
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Compile Debug and Release APKs
        working-directory: flip_clock_build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RealmeFlipOdometerClock-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../RealmeFlipOdometerClock-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../RealmeFlipOdometerClock.apk
          rm -f release-keystore.jks

      - name: Upload Ready-to-Install Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: RealmeFlipOdometerClock-APK
          path: |
            RealmeFlipOdometerClock.apk
            RealmeFlipOdometerClock-debug.apk
            RealmeFlipOdometerClock-release.apk
          if-no-files-found: error
