                  // 2. Set as Home / Lock Screen Live Wallpaper
                  Button setWpBtn = makeButton("2. Set as Home / Lock Screen Live Wallpaper", "#E11D48", "#FFFFFF");
                  setWpBtn.setOnClickListener(new View.OnClickListener() {
