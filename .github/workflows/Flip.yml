          mkdir -p "app/src/test/java/com/realme/flipclock"
          cat << 'EOF_FILE' > "app/src/test/java/com/realme/flipclock/ClockLogicTest.java"
          package com.realme.flipclock;
          
          import org.junit.Test;
          import static org.junit.Assert.*;
          
          public class ClockLogicTest {
          
              @Test
              public void testEaseInOutFlipBounds() {
                  assertEquals(0.0f, FlipOdometerRenderer.easeInOutFlip(-0.5f), 0.0001f);
                  assertEquals(0.0f, FlipOdometerRenderer.easeInOutFlip(0.0f), 0.0001f);
                  assertEquals(0.5f, FlipOdometerRenderer.easeInOutFlip(0.5f), 0.0001f);
                  assertEquals(1.0f, FlipOdometerRenderer.easeInOutFlip(1.0f), 0.0001f);
                  assertEquals(1.0f, FlipOdometerRenderer.easeInOutFlip(1.5f), 0.0001f);
              }
          
              @Test
              public void testIsFlipAnimationActiveWindow() {
                  // At 100ms into a second with 440ms flip duration and seconds enabled -> active
                  long tActive = 1700000001100L;
                  assertTrue(FlipOdometerRenderer.isFlipAnimationActive(tActive, 440.0f, true, false));
          
                  // At 600ms into a second with 440ms flip duration -> idle (not active)
                  long tIdle = 1700000001600L;
                  assertFalse(FlipOdometerRenderer.isFlipAnimationActive(tIdle, 440.0f, true, false));
              }
          
              @Test
              public void testBatterySaverDisablesPerSecondAnimation() {
                  // Non-zero second (e.g. second == 15, ms == 100): active when batterySaver=false, idle when batterySaver=true
                  long tNonZeroSec = 15100L;
                  assertTrue(FlipOdometerRenderer.isFlipAnimationActive(tNonZeroSec, 440.0f, true, false));
                  assertFalse(FlipOdometerRenderer.isFlipAnimationActive(tNonZeroSec, 440.0f, true, true));
          
                  // Delay when idle in battery saver mode should sleep multiple seconds until next minute boundary
                  long delayMs = FlipOdometerRenderer.computeNextFrameDelayMs(tNonZeroSec, 440.0f, true, true);
                  assertTrue("Expected sleep > 1000ms in battery saver mode, got " + delayMs, delayMs > 1000L);
              }
          
              @Test
              public void testAmoledShiftBounded() {
                  for (int m = 0; m < 120; m++) {
                      long ts = m * 60000L;
                      float sx = ClockPrefs.getAmoledShiftX(null, ts);
                      float sy = ClockPrefs.getAmoledShiftY(null, ts);
                      assertTrue(Math.abs(sx) <= 6.01f);
                      assertTrue(Math.abs(sy) <= 6.01f);
                  }
              }
          }
