              private static class LivePreviewView extends View implements Choreographer.FrameCallback {
          
                  private final FlipOdometerRenderer renderer = new FlipOdometerRenderer();
                  private final Handler handler = new Handler(Looper.getMainLooper());
                  private boolean active = false;
          
                  private final Runnable wakeupRunnable = new Runnable() {
                      @Override
                      public void run() {
                          handler.removeCallbacks(this);
                          if (!active) return;
                          Choreographer.getInstance().removeFrameCallback(LivePreviewView.this);
                          Choreographer.getInstance().postFrameCallback(LivePreviewView.this);
                      }
                  };
          
                  public LivePreviewView(Context context) {
                      super(context);
                  }
          
                  public void start() {
                      active = true;
                      triggerImmediateFrame();
                  }
          
                  public void stop() {
                      active = false;
                      handler.removeCallbacksAndMessages(null);
                      Choreographer.getInstance().removeFrameCallback(this);
                  }
          
                  public void triggerImmediateFrame() {
                      handler.removeCallbacks(wakeupRunnable);
                      Choreographer.getInstance().removeFrameCallback(this);
                      if (active) {
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  }
          
                  @Override
                  public void doFrame(long frameTimeNanos) {
                      if (!active) {
                          return;
                      }
                      invalidate();
                      long now = System.currentTimeMillis();
                      Context ctx = getContext();
                      long nextDelay = FlipOdometerRenderer.computeNextFrameDelayMs(
                              now,
                              ClockPrefs.getFlipDurationMs(ctx),
                              ClockPrefs.isShowSeconds(ctx),
                              ClockPrefs.isBatterySaverMode(ctx)
                      );
                      handler.removeCallbacks(wakeupRunnable);
                      Choreographer.getInstance().removeFrameCallback(this);
                      if (nextDelay <= 0L) {
                          Choreographer.getInstance().postFrameCallback(this);
                      } else {
                          handler.postDelayed(wakeupRunnable, nextDelay);
                      }
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int mode = ClockPrefs.getThemeMode(getContext());
                      if (!ClockPrefs.hasCustomBackground(getContext())) {
                          if (mode == ClockPrefs.MODE_TRANS_LIGHT_TEXT) {
                              canvas.drawColor(Color.parseColor("#1E293B"));
                          } else if (mode == ClockPrefs.MODE_TRANS_DARK_TEXT) {
                              canvas.drawColor(Color.parseColor("#E2E8F0"));
                          }
                      }
                      renderer.drawClock(
                              getContext(),
                              canvas,
                              getWidth(),
                              getHeight(),
                              System.currentTimeMillis(),
                              mode,
                              ClockPrefs.isUse24Hour(getContext()),
                              ClockPrefs.POS_CENTER,
                              false,
                              0f,
                              0f
                      );
                  }
              }
          }
