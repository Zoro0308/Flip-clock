                  float bigCardH = bigCardW * 1.04f;
                  float gap = bigCardW * gapRatio;
                  float secCardW = bigCardW * 0.53f;
                  float secCardH = bigCardH * 0.49f;
          
                  float totalW = showSeconds
                          ? (bigCardW * 2.0f + secCardW + gap * 2.0f)
                          : (bigCardW * 2.0f + gap);
                  float startX = (width - totalW) * 0.5f + pixelShiftX;
          
                  float centerY;
                  if (verticalPos == ClockPrefs.POS_TOP_WIDGET) {
                      centerY = Math.max(bigCardH * 0.75f, height * 0.30f) + pixelShiftY;
                  } else if (verticalPos == ClockPrefs.POS_BOTTOM) {
                      centerY = Math.min(height - bigCardH * 0.75f, height * 0.72f) + pixelShiftY;
                  } else {
                      centerY = height * 0.52f + pixelShiftY;
                  }
                  float topY = centerY - bigCardH * 0.5f;
          
                  // Optional Date Header above the cards
                  if (showDate) {
                      datePaint.setColor(digitColor);
                      datePaint.setAlpha(210);
                      datePaint.setTextSize(Math.max(18.0f, bigCardH * 0.105f));
                      String dateStr = formatDateHeader(nowMillis);
                      canvas.drawText(dateStr, width * 0.5f + pixelShiftX, Math.max(datePaint.getTextSize() + 8f, topY - bigCardH * 0.08f), datePaint);
                  }
          
                  String amPmBadge = use24Hour ? null : (isPm ? "PM" : "AM");
          
                  draw3DSplitFlapCard(
                          canvas,
                          startX, topY, bigCardW, bigCardH,
                          prevHourStr, currHourStr, hourFlipP,
                          amPmBadge,
                          cardTopColor, cardBottomColor, flapFaceColor, borderColor, digitColor, splitLineColor
                  );
          
                  float minX = startX + bigCardW + gap;
                  draw3DSplitFlapCard(
                          canvas,
                          minX, topY, bigCardW, bigCardH,
                          prevMinStr, currMinStr, minFlipP,
                          null,
                          cardTopColor, cardBottomColor, flapFaceColor, borderColor, digitColor, splitLineColor
                  );
          
                  if (showSeconds) {
                      float secX = minX + bigCardW + gap;
                      float secY = topY + bigCardH - secCardH;
                      draw3DSplitFlapCard(
                              canvas,
                              secX, secY, secCardW, secCardH,
                              prevSecStr, currSecStr, secFlipP,
                              null,
                              cardTopColor, cardBottomColor, flapFaceColor, borderColor, digitColor, splitLineColor
                      );
                  }
              }
          
              private void draw3DSplitFlapCard(
                      Canvas canvas,
                      float x, float y, float w, float h,
                      String oldText, String newText, float flipP,
                      String badgeText,
                      int cardTopColor, int cardBottomColor, int flapFaceColor,
                      int borderColor, int digitColor, int splitLineColor
              ) {
                  float radius = Math.min(w, h) * 0.085f;
                  float cx = x + w * 0.5f;
                  float cy = y + h * 0.5f;
                  cardRect.set(x, y, x + w, y + h);
          
                  LinearGradient baseGrad = new LinearGradient(
                          x, y, x, y + h,
                          cardTopColor, cardBottomColor,
                          Shader.TileMode.CLAMP
                  );
                  cardPaint.setShader(baseGrad);
                  canvas.drawRoundRect(cardRect, radius, radius, cardPaint);
                  cardPaint.setShader(null);
          
                  digitPaint.setTextSize(h * 0.72f);
                  Paint.FontMetrics fm = digitPaint.getFontMetrics();
                  float textBaseline = cy - (fm.ascent + fm.descent) * 0.5f;
          
                  if (flipP <= 0.001f || flipP >= 0.999f) {
                      canvas.save();
                      cardClipPath.reset();
                      cardClipPath.addRoundRect(cardRect, radius, radius, Path.Direction.CW);
                      canvas.clipPath(cardClipPath);
                      digitPaint.setColor(digitColor);
                      digitPaint.setAlpha(255);
                      canvas.drawText(newText, cx, textBaseline, digitPaint);
                      canvas.restore();
                  } else {
                      canvas.save();
                      cardClipPath.reset();
                      cardClipPath.addRoundRect(cardRect, radius, radius, Path.Direction.CW);
                      canvas.clipPath(cardClipPath);
                      canvas.clipRect(x, y, x + w, cy);
                      digitPaint.setColor(digitColor);
                      digitPaint.setAlpha((int) (160 + 95 * flipP));
                      canvas.drawText(newText, cx, textBaseline, digitPaint);
                      canvas.restore();
          
                      canvas.save();
                      cardClipPath.reset();
                      cardClipPath.addRoundRect(cardRect, radius, radius, Path.Direction.CW);
                      canvas.clipPath(cardClipPath);
                      canvas.clipRect(x, cy, x + w, y + h);
                      digitPaint.setColor(digitColor);
                      digitPaint.setAlpha(230);
                      canvas.drawText(oldText, cx, textBaseline, digitPaint);
          
                      if (flipP >= 0.5f) {
                          float theta = (float) (flipP * Math.PI);
                          float sinT = (float) Math.sin(theta);
                          float cosT = (float) Math.abs(Math.cos(theta));
                          float flapH = (h * 0.5f) * Math.max(0.15f, cosT);
                          float shadowBottom = Math.min(y + h, cy + flapH + h * 0.12f * sinT);
                          shadowPaint.setColor(Color.argb((int) (165 * sinT), 0, 0, 0));
                          canvas.drawRect(x, cy, x + w, shadowBottom, shadowPaint);
                      }
                      canvas.restore();
          
                      float theta = (float) (flipP * Math.PI);
                      float sinT = (float) Math.sin(theta);
                      float scaleY = Math.max(0.16f, (float) Math.abs(Math.cos(theta)));
                      float flapH = (h * 0.5f) * scaleY;
                      float flareX = sinT * (w * 0.065f);
          
                      canvas.save();
                      flapPath.reset();
                      if (flipP < 0.5f) {
                          float fyTop = cy - flapH;
                          flapPath.moveTo(x, cy);
                          flapPath.lineTo(x + w, cy);
                          flapPath.lineTo(x + w + flareX, fyTop);
                          flapPath.lineTo(x - flareX, fyTop);
                          flapPath.close();
          
                          cardPaint.setColor(flapFaceColor);
                          canvas.drawPath(flapPath, cardPaint);
          
                          canvas.clipPath(flapPath);
                          canvas.scale(1.0f, scaleY, cx, cy);
                          digitPaint.setColor(digitColor);
                          digitPaint.setAlpha(255);
                          canvas.drawText(oldText, cx, textBaseline, digitPaint);
                      } else {
                          float fyBot = cy + flapH;
                          flapPath.moveTo(x, cy);
                          flapPath.lineTo(x + w, cy);
                          flapPath.lineTo(x + w + flareX, fyBot);
                          flapPath.lineTo(x - flareX, fyBot);
                          flapPath.close();
          
                          cardPaint.setColor(flapFaceColor);
                          canvas.drawPath(flapPath, cardPaint);
          
                          canvas.clipPath(flapPath);
                          canvas.scale(1.0f, scaleY, cx, cy);
                          digitPaint.setColor(digitColor);
                          digitPaint.setAlpha(255);
                          canvas.drawText(newText, cx, textBaseline, digitPaint);
                      }
                      canvas.restore();
          
                      borderPaint.setColor(borderColor);
                      borderPaint.setStrokeWidth(Math.max(1.5f, h * 0.006f));
                      canvas.drawPath(flapPath, borderPaint);
                  }
          
                  splitLinePaint.setColor(splitLineColor);
                  splitLinePaint.setStrokeWidth(Math.max(2.2f, h * 0.013f));
                  canvas.drawLine(x, cy, x + w, cy, splitLinePaint);
          
                  if (badgeText != null) {
                      badgePaint.setColor(digitColor);
                      badgePaint.setAlpha(215);
                      badgePaint.setTextSize(h * 0.095f);
                      canvas.drawText(badgeText, x + w * 0.065f, y + h * 0.92f, badgePaint);
                  }
          
                  borderPaint.setColor(borderColor);
                  borderPaint.setStrokeWidth(Math.max(1.5f, h * 0.006f));
                  canvas.drawRoundRect(cardRect, radius, radius, borderPaint);
              }
          
              private void drawCenterCropBitmap(Canvas canvas, Bitmap bmp, int viewW, int viewH) {
                  int bw = bmp.getWidth();
                  int bh = bmp.getHeight();
                  if (bw <= 0 || bh <= 0) {
                      return;
                  }
                  float scale = Math.max((float) viewW / bw, (float) viewH / bh);
                  int cropW = Math.round(viewW / scale);
                  int cropH = Math.round(viewH / scale);
                  int cropX = Math.max(0, (bw - cropW) / 2);
                  int cropY = Math.max(0, (bh - cropH) / 2);
                  srcRect.set(cropX, cropY, cropX + cropW, cropY + cropH);
                  dstRect.set(0, 0, viewW, viewH);
                  canvas.drawBitmap(bmp, srcRect, dstRect, bgBitmapPaint);
              }
          
              public static float easeInOutFlip(float t) {
                  if (t <= 0.0f) return 0.0f;
                  if (t >= 1.0f) return 1.0f;
                  return t * t * (3.0f - 2.0f * t);
              }
          }
