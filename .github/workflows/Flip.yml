              public static boolean saveCustomBackgroundFromUri(Context context, Uri uri) {
                  if (uri == null) {
                      return false;
                  }
                  InputStream in1 = null;
                  InputStream in2 = null;
                  FileOutputStream fos = null;
                  try {
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      in1 = context.getContentResolver().openInputStream(uri);
                      BitmapFactory.decodeStream(in1, null, bounds);
                      if (in1 != null) {
                          in1.close();
                          in1 = null;
                      }
          
                      int maxDim = Math.max(bounds.outWidth, bounds.outHeight);
                      int sampleSize = 1;
                      while (maxDim / sampleSize > 2048) {
                          sampleSize *= 2;
                      }
          
                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      opts.inSampleSize = sampleSize;
                      in2 = context.getContentResolver().openInputStream(uri);
                      Bitmap decoded = BitmapFactory.decodeStream(in2, null, opts);
                      if (decoded == null) {
                          Log.e(TAG, "Decoded bitmap was null for URI: " + uri);
                          return false;
                      }
          
                      File outFile = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                      fos = new FileOutputStream(outFile);
                      decoded.compress(Bitmap.CompressFormat.JPEG, 90, fos);
                      fos.flush();
                      decoded.recycle();
          
                      context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                              .edit()
                              .putBoolean(KEY_HAS_CUSTOM_BG, true)
                              .putLong(KEY_CUSTOM_BG_STAMP, System.currentTimeMillis())
                              .apply();
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "Failed to save custom background from URI", e);
                      return false;
                  } finally {
                      try {
                          if (in1 != null) in1.close();
                      } catch (Exception e) {
                          Log.w(TAG, "Error closing input stream 1", e);
                      }
                      try {
                          if (in2 != null) in2.close();
                      } catch (Exception e) {
                          Log.w(TAG, "Error closing input stream 2", e);
                      }
                      try {
                          if (fos != null) fos.close();
                      } catch (Exception e) {
                          Log.w(TAG, "Error closing file output stream", e);
                      }
                  }
              }
          
              public static Bitmap loadCustomBackgroundBitmap(Context context) {
