          package com.realme.flipclock;
          
          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Bundle;
          import android.view.Choreographer;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.widget.Toast;
          
          public class FullScreenClockActivity extends Activity {
          
              private LiveFlipClockView clockView;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WALLPAPER);
                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
          
                  clockView = new LiveFlipClockView(this);
                  setContentView(clockView);
                  hideSystemBars();
                  Toast.makeText(this, "Tap screen to cycle Dark / White / Transparent modes", Toast.LENGTH_SHORT).show();
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemBars();
                  clockView.startAnimation();
              }
          
              @Override
              protected void onPause() {
                  clockView.stopAnimation();
                  super.onPause();
              }
          
              private void hideSystemBars() {
                  WindowInsetsController controller = getWindow().getInsetsController();
                  if (controller != null) {
                      controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                      controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              }
          
              private static class LiveFlipClockView extends View implements Choreographer.FrameCallback {
          
                  private final FlipOdometerRenderer renderer = new FlipOdometerRenderer();
                  private boolean running = false;
          
                  public LiveFlipClockView(Context context) {
                      super(context);
                  }
          
                  public void startAnimation() {
                      if (!running) {
                          running = true;
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  }
          
                  public void stopAnimation() {
                      running = false;
                      Choreographer.getInstance().removeFrameCallback(this);
                  }
          
                  @Override
                  public void doFrame(long frameTimeNanos) {
                      if (!running) {
                          return;
                      }
                      invalidate();
                      Choreographer.getInstance().postFrameCallback(this);
                  }
          
                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          int next = ClockPrefs.cycleThemeMode(getContext());
                          String[] names = {
                              "AMOLED Dark Mode",
                              "White / Light Mode",
                              "Transparent (White Digits over Wallpaper)",
                              "Transparent (Dark Digits over Wallpaper)"
                          };
                          Toast.makeText(getContext(), names[next], Toast.LENGTH_SHORT).show();
                          invalidate();
                          return true;
                      }
                      return super.onTouchEvent(event);
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      long now = System.currentTimeMillis();
                      int theme = ClockPrefs.getThemeMode(getContext());
                      boolean showMs = ClockPrefs.isShowMsBox(getContext());
                      boolean use24h = ClockPrefs.isUse24Hour(getContext());
          
                      // Subtle AMOLED burn-in protection shift every minute
                      long minuteBucket = now / 60000L;
                      float shiftX = (float) Math.sin(minuteBucket * 0.7) * 6.0f;
                      float shiftY = (float) Math.cos(minuteBucket * 0.7) * 6.0f;
          
                      renderer.drawClock(
                              canvas,
                              getWidth(),
                              getHeight(),
                              now,
                              theme,
                              showMs,
                              use24h,
                              ClockPrefs.POS_CENTER,
                              true,
                              shiftX,
                              shiftY
                      );
                  }
              }
          }
