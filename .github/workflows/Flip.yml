name: Build Realme 60fps 3D Flip Clock APK (v4.0)

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK 35 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android Flip Clock v4.0 Project Files
        run: |
          mkdir -p flip_clock_build
          cd flip_clock_build
          cat << 'EOF_FILE' > "settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RealmeFlipOdometerClock"
          include ':app'
          EOF_FILE

          cat << 'EOF_FILE' > "build.gradle"
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF_FILE

          cat << 'EOF_FILE' > "gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF_FILE

          mkdir -p "app"
          cat << 'EOF_FILE' > "app/build.gradle"
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.realme.flipclock'
              compileSdk 35
          
              defaultConfig {
                  applicationId "com.realme.flipclock"
                  minSdk 31
                  targetSdk 35
                  versionCode 4
                  versionName "4.0"
              }
          
              signingConfigs {
                  release {
                      def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
                      def ksPass = System.getenv("SIGNING_STORE_PASSWORD")
                      def kAlias = System.getenv("SIGNING_KEY_ALIAS")
                      def kPass = System.getenv("SIGNING_KEY_PASSWORD")
                      if (ksPath != null && !ksPath.isEmpty() && new File(ksPath).exists()
                              && ksPass != null && kAlias != null && kPass != null) {
                          storeFile file(ksPath)
                          storePassword ksPass
                          keyAlias kAlias
                          keyPassword kPass
                      }
                  }
              }
          
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
                      if (ksPath != null && !ksPath.isEmpty() && new File(ksPath).exists()) {
                          signingConfig signingConfigs.release
                      } else {
                          signingConfig signingConfigs.debug
                      }
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          
              testOptions {
                  unitTests.returnDefaultValues = true
              }
          }
          
          dependencies {
              testImplementation 'junit:junit:4.13.2'
          }
          EOF_FILE

          mkdir -p "app/src/main"
          cat << 'EOF_FILE' > "app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <!-- Strictly offline: no INTERNET permission requested -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          
              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="false" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|fontScale|smallestScreenSize"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".FullScreenClockActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|fontScale|smallestScreenSize"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar.Fullscreen"
                      android:label="@string/app_name" />
          
                  <service
                      android:name=".FlipOdometerWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/wallpaper_label"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper_info" />
                  </service>
          
                  <service
                      android:name=".FlipWidgetService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Live 60fps ViewFlipper home screen flip clock widget second ticker" />
                  </service>
          
                  <receiver
                      android:name=".FlipOdometerWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_label">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.appwidget.action.APPWIDGET_DELETED" />
                          <action android:name="android.appwidget.action.APPWIDGET_DISABLED" />
                          <action android:name="android.appwidget.action.APPWIDGET_ENABLED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_CYCLE_THEME" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_OPEN_APP" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_MINUTE_ALARM" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/flip_widget_info" />
                  </receiver>
          
                  <receiver
                      android:name=".BootCompletedReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
          
              </application>
          </manifest>
          EOF_FILE

          mkdir -p "app/src/main/res/values"
          cat << 'EOF_FILE' > "app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">3D Flip Clock</string>
              <string name="wallpaper_label">3D Split-Flap Live Wallpaper</string>
              <string name="wallpaper_description">Hardware-accelerated 3D split-flap flip clock with per-widget themes, battery-saving mode, AMOLED protection, and offline gallery backgrounds.</string>
              <string name="widget_label">3D Flip Clock Widget (60fps Smooth)</string>
          </resources>
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/wallpaper_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description"
              android:settingsActivity="com.realme.flipclock.MainActivity"
              android:thumbnail="@drawable/ic_launcher" />
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/flip_widget_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:minResizeWidth="160dp"
              android:minResizeHeight="75dp"
              android:maxResizeWidth="900dp"
              android:maxResizeHeight="500dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_flip"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/wallpaper_description" />
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_top_out.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="top">
              <scale
                  android:interpolator="@android:anim/accelerate_interpolator"
                  android:fromXScale="1.0"
                  android:toXScale="1.0"
                  android:fromYScale="1.0"
                  android:toYScale="0.0"
                  android:pivotX="50%"
                  android:pivotY="100%"
                  android:duration="170" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_top_in.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="bottom">
              <alpha
                  android:fromAlpha="0.6"
                  android:toAlpha="1.0"
                  android:duration="170" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_bot_in.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="top"
              android:fillBefore="true"
              android:fillEnabled="true">
              <scale
                  android:interpolator="@android:anim/decelerate_interpolator"
                  android:startOffset="165"
                  android:fromXScale="1.0"
                  android:toXScale="1.0"
                  android:fromYScale="0.0"
                  android:toYScale="1.0"
                  android:pivotX="50%"
                  android:pivotY="0%"
                  android:duration="180"
                  android:fillBefore="true"
                  android:fillEnabled="true" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_bot_out.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="bottom">
              <alpha
                  android:startOffset="165"
                  android:fromAlpha="1.0"
                  android:toAlpha="0.35"
                  android:duration="180" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/widget_bg_dark.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/widget_bg_light.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F2F2F7" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/widget_bg_trans.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#00000000" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE

          mkdir -p "app/src/main/res/layout"
          cat << 'EOF_FILE' > "app/src/main/res/layout/widget_flip.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg_dark"
              android:padding="8dp">
          
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center">
          
                  <!-- Optional Date Header above flip cards -->
                  <TextView
                      android:id="@+id/widget_date_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#94A3B8"
                      android:textSize="11sp"
                      android:textStyle="bold"
                      android:letterSpacing="0.06"
                      android:paddingBottom="4dp"
                      android:singleLine="true"
                      android:ellipsize="end"
                      android:visibility="gone" />
          
                  <LinearLayout
                      android:id="@+id/widget_cards_row"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:orientation="horizontal"
                      android:gravity="center">
          
                      <!-- CARD 1: HOURS -->
                      <LinearLayout
                          android:id="@+id/hour_card_box"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="100"
                          android:orientation="vertical"
                          android:weightSum="2">
          
                          <ViewFlipper
                              android:id="@+id/hour_top_flipper"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="1"
                              android:inAnimation="@anim/flap_top_in"
                              android:outAnimation="@anim/flap_top_out">
                              <ImageView
                                  android:id="@+id/hour_top_0"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                              <ImageView
                                  android:id="@+id/hour_top_1"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                          </ViewFlipper>
          
                          <ViewFlipper
                              android:id="@+id/hour_bot_flipper"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="1"
                              android:inAnimation="@anim/flap_bot_in"
                              android:outAnimation="@anim/flap_bot_out">
                              <ImageView
                                  android:id="@+id/hour_bot_0"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                              <ImageView
                                  android:id="@+id/hour_bot_1"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                          </ViewFlipper>
                      </LinearLayout>
          
                      <FrameLayout
                          android:id="@+id/min_spacer"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="6" />
          
                      <!-- CARD 2: MINUTES -->
                      <LinearLayout
                          android:id="@+id/min_card_box"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="100"
                          android:orientation="vertical"
                          android:weightSum="2">
          
                          <ViewFlipper
                              android:id="@+id/min_top_flipper"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="1"
                              android:inAnimation="@anim/flap_top_in"
                              android:outAnimation="@anim/flap_top_out">
                              <ImageView
                                  android:id="@+id/min_top_0"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                              <ImageView
                                  android:id="@+id/min_top_1"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                          </ViewFlipper>
          
                          <ViewFlipper
                              android:id="@+id/min_bot_flipper"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="1"
                              android:inAnimation="@anim/flap_bot_in"
                              android:outAnimation="@anim/flap_bot_out">
                              <ImageView
                                  android:id="@+id/min_bot_0"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                              <ImageView
                                  android:id="@+id/min_bot_1"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                          </ViewFlipper>
                      </LinearLayout>
          
                      <FrameLayout
                          android:id="@+id/sec_spacer"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="6" />
          
                      <!-- CARD 3: SECONDS (Hidable when Show Seconds is disabled) -->
                      <LinearLayout
                          android:id="@+id/sec_column_box"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="52"
                          android:orientation="vertical"
                          android:weightSum="100">
          
                          <FrameLayout
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="50" />
          
                          <LinearLayout
                              android:id="@+id/sec_card_box"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="50"
                              android:orientation="vertical"
                              android:weightSum="2">
          
                              <ViewFlipper
                                  android:id="@+id/sec_top_flipper"
                                  android:layout_width="match_parent"
                                  android:layout_height="0dp"
                                  android:layout_weight="1"
                                  android:inAnimation="@anim/flap_top_in"
                                  android:outAnimation="@anim/flap_top_out">
                                  <ImageView
                                      android:id="@+id/sec_top_0"
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:scaleType="fitXY"
                                      android:contentDescription="@string/app_name" />
                                  <ImageView
                                      android:id="@+id/sec_top_1"
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:scaleType="fitXY"
                                      android:contentDescription="@string/app_name" />
                              </ViewFlipper>
          
                              <ViewFlipper
                                  android:id="@+id/sec_bot_flipper"
                                  android:layout_width="match_parent"
                                  android:layout_height="0dp"
                                  android:layout_weight="1"
                                  android:inAnimation="@anim/flap_bot_in"
                                  android:outAnimation="@anim/flap_bot_out">
                                  <ImageView
                                      android:id="@+id/sec_bot_0"
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:scaleType="fitXY"
                                      android:contentDescription="@string/app_name" />
                                  <ImageView
                                      android:id="@+id/sec_bot_1"
                                      android:layout_width="match_parent"
                                      android:layout_height="match_parent"
                                      android:scaleType="fitXY"
                                      android:contentDescription="@string/app_name" />
                              </ViewFlipper>
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          
              <!-- Interactive Tap Zones: Left 2/3 cycles this specific widget's theme; Right 1/3 opens settings -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="horizontal"
                  android:weightSum="3">
          
                  <FrameLayout
                      android:id="@+id/widget_left_tap"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="2" />
          
                  <FrameLayout
                      android:id="@+id/widget_right_tap"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1" />
              </LinearLayout>
          </FrameLayout>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M18,0 L90,0 A18,18 0 0,1 108,18 L108,90 A18,18 0 0,1 90,108 L18,108 A18,18 0 0,1 0,90 L0,18 A18,18 0 0,1 18,0 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M14,26 L50,26 A6,6 0 0,1 56,32 L56,76 A6,6 0 0,1 50,82 L14,82 A6,6 0 0,1 8,76 L8,32 A6,6 0 0,1 14,26 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M64,26 L94,26 A6,6 0 0,1 100,32 L100,76 A6,6 0 0,1 94,82 L64,82 A6,6 0 0,1 58,76 L58,32 A6,6 0 0,1 64,26 Z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M24,40 L24,68 M40,40 L40,68 M72,40 L86,40 L86,54 L72,54 L72,68 L86,68" />
              <path
                  android:strokeColor="#000000"
                  android:strokeWidth="2.5"
                  android:pathData="M8,54 L100,54" />
          </vector>
          EOF_FILE

          mkdir -p "app/src/main/java/com/realme/flipclock"
          cat << 'EOF_FILE' > "app/src/main/java/com/realme/flipclock/ClockPrefs.java"
          package com.realme.flipclock;
          
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.util.Log;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          
          public class ClockPrefs {
          
              private static final String TAG = "ClockPrefs";
          
              // Preserve PREFS_NAME from v3.0 for full backward compatibility
              public static final String PREFS_NAME = "FlipClockV3Prefs";
              public static final String KEY_THEME_MODE = "theme_mode";
              public static final String KEY_WIDGET_THEME_PREFIX = "widget_theme_";
              public static final String KEY_USE_24H = "use_24h";
              public static final String KEY_VERTICAL_POS = "vertical_pos";
              public static final String KEY_HAS_CUSTOM_BG = "has_custom_bg";
              public static final String KEY_CUSTOM_BG_STAMP = "custom_bg_stamp";
              public static final String CUSTOM_BG_FILENAME = "custom_wallpaper_bg.jpg";
          
              // New v4.0 customization & optimization keys
              public static final String KEY_SHOW_SECONDS = "show_seconds";
              public static final String KEY_BATTERY_SAVER = "battery_saver_mode";
              public static final String KEY_FLIP_SPEED_MODE = "flip_speed_mode";
              public static final String KEY_CLOCK_SIZE_MODE = "clock_size_mode";
              public static final String KEY_CARD_SPACING_MODE = "card_spacing_mode";
