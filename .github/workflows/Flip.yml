          package com.realme.flipclock;
          
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.widget.RemoteViews;
          import java.util.Calendar;
          import java.util.Locale;
          
          public class FlipOdometerWidgetProvider extends AppWidgetProvider {
          
              public static final String ACTION_WIDGET_CYCLE_THEME = "com.realme.flipclock.ACTION_WIDGET_CYCLE_THEME";
              public static final String ACTION_WIDGET_OPEN_APP = "com.realme.flipclock.ACTION_WIDGET_OPEN_APP";
          
              private static final FlipOdometerRenderer sharedRenderer = new FlipOdometerRenderer();
          
              private static int lastRenderedHour = -1;
              private static int lastRenderedMin = -1;
              private static int lastRenderedSec = -1;
              private static int lastRenderedTheme = -1;
              private static boolean lastRendered24h = false;
          
              @Override
              public void onEnabled(Context context) {
                  super.onEnabled(context);
                  FlipWidgetService.ensureRunning(context);
              }
          
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                  FlipWidgetService.ensureRunning(context);
              }
          
              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager appWidgetManager, int appWidgetId, Bundle newOptions) {
                  super.onAppWidgetOptionsChanged(context, appWidgetManager, appWidgetId, newOptions);
                  tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                  FlipWidgetService.ensureRunning(context);
              }
          
              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (intent == null || intent.getAction() == null) {
                      return;
                  }
                  String action = intent.getAction();
                  if (ACTION_WIDGET_CYCLE_THEME.equals(action)) {
                      ClockPrefs.cycleThemeMode(context);
                      tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                      FlipWidgetService.ensureRunning(context);
                  } else if (ACTION_WIDGET_OPEN_APP.equals(action)) {
                      FlipWidgetService.ensureRunning(context);
                      Intent openApp = new Intent(context, MainActivity.class);
                      openApp.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(openApp);
                  } else {
                      tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                      FlipWidgetService.ensureRunning(context);
                  }
              }
          
              public static void updateAllWidgets(Context context) {
                  tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                  FlipWidgetService.ensureRunning(context);
              }
          
              public static synchronized void tickWidgetOnSecondBoundary(
                      Context context,
                      long nowMillis,
                      boolean forceFullUpdate
              ) {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      ComponentName cn = new ComponentName(context, FlipOdometerWidgetProvider.class);
                      int[] ids = mgr.getAppWidgetIds(cn);
                      if (ids == null || ids.length == 0) {
                          return;
                      }
          
                      int theme = ClockPrefs.getThemeMode(context);
                      boolean use24h = ClockPrefs.isUse24Hour(context);
          
                      if (theme != lastRenderedTheme || use24h != lastRendered24h) {
                          forceFullUpdate = true;
                      }
          
                      Calendar cal = Calendar.getInstance();
                      cal.setTimeInMillis(nowMillis);
          
                      int sec = cal.get(Calendar.SECOND);
                      int min = cal.get(Calendar.MINUTE);
                      int hour24 = cal.get(Calendar.HOUR_OF_DAY);
                      boolean isPm = (hour24 >= 12);
                      int hourDisp = use24h ? hour24 : (hour24 % 12 == 0 ? 12 : hour24 % 12);
          
                      if (!forceFullUpdate && sec == lastRenderedSec && min == lastRenderedMin && hourDisp == lastRenderedHour) {
                          return;
                      }
          
                      Calendar prevCal = Calendar.getInstance();
                      prevCal.setTimeInMillis(nowMillis - 1000L);
                      int prevSec = prevCal.get(Calendar.SECOND);
                      int prevMin = prevCal.get(Calendar.MINUTE);
                      int prevHour24 = prevCal.get(Calendar.HOUR_OF_DAY);
                      boolean prevIsPm = (prevHour24 >= 12);
                      int prevHourDisp = use24h ? prevHour24 : (prevHour24 % 12 == 0 ? 12 : prevHour24 % 12);
          
                      String hourStr = use24h ? String.format(Locale.US, "%02d", hourDisp) : String.valueOf(hourDisp);
                      String prevHourStr = use24h ? String.format(Locale.US, "%02d", prevHourDisp) : String.valueOf(prevHourDisp);
                      String badge = use24h ? null : (isPm ? "PM" : "AM");
                      String prevBadge = use24h ? null : (prevIsPm ? "PM" : "AM");
          
                      String minStr = String.format(Locale.US, "%02d", min);
                      String prevMinStr = String.format(Locale.US, "%02d", prevMin);
          
                      String secStr = String.format(Locale.US, "%02d", sec);
                      String prevSecStr = String.format(Locale.US, "%02d", prevSec);
          
                      int secSlot = sec % 2;
                      int minSlot = min % 2;
                      int hourSlot = hourDisp % 2;
          
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_flip);
          
                      if (forceFullUpdate) {
                          int bgRes;
                          if (theme == ClockPrefs.MODE_AMOLED_DARK) {
                              bgRes = R.drawable.widget_bg_dark;
                          } else if (theme == ClockPrefs.MODE_WHITE_LIGHT) {
                              bgRes = R.drawable.widget_bg_light;
                          } else {
                              bgRes = R.drawable.widget_bg_trans;
                          }
                          views.setInt(R.id.widget_root, "setBackgroundResource", bgRes);
          
                          // Populate both slots so the outgoing slot always holds the previous digit for 60fps ViewFlipper animation
                          populateDualSlot(views, true, hourSlot, hourStr, badge, prevHourStr, prevBadge, 240, 250, theme,
                                  R.id.hour_top_flipper, R.id.hour_bot_flipper,
                                  R.id.hour_top_0, R.id.hour_bot_0, R.id.hour_top_1, R.id.hour_bot_1);
          
                          populateDualSlot(views, true, minSlot, minStr, null, prevMinStr, null, 240, 250, theme,
                                  R.id.min_top_flipper, R.id.min_bot_flipper,
                                  R.id.min_top_0, R.id.min_bot_0, R.id.min_top_1, R.id.min_bot_1);
          
                          populateDualSlot(views, true, secSlot, secStr, null, prevSecStr, null, 130, 136, theme,
                                  R.id.sec_top_flipper, R.id.sec_bot_flipper,
                                  R.id.sec_top_0, R.id.sec_bot_0, R.id.sec_top_1, R.id.sec_bot_1);
          
                          Intent cycleIntent = new Intent(context, FlipOdometerWidgetProvider.class);
                          cycleIntent.setAction(ACTION_WIDGET_CYCLE_THEME);
                          PendingIntent cyclePi = PendingIntent.getBroadcast(
                                  context, 100, cycleIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          views.setOnClickPendingIntent(R.id.widget_left_tap, cyclePi);
          
                          Intent openIntent = new Intent(context, FlipOdometerWidgetProvider.class);
                          openIntent.setAction(ACTION_WIDGET_OPEN_APP);
                          PendingIntent openPi = PendingIntent.getBroadcast(
                                  context, 200, openIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          views.setOnClickPendingIntent(R.id.widget_right_tap, openPi);
          
                          mgr.updateAppWidget(ids, views);
                      } else {
                          // Lightweight partial update: ONLY update the card(s) that changed this second!
                          // Calling setDisplayedChild triggers the Launcher's 60/120fps GPU ViewFlipper animation!
                          populateDualSlot(views, false, secSlot, secStr, null, prevSecStr, null, 130, 136, theme,
                                  R.id.sec_top_flipper, R.id.sec_bot_flipper,
                                  R.id.sec_top_0, R.id.sec_bot_0, R.id.sec_top_1, R.id.sec_bot_1);
          
                          if (min != lastRenderedMin) {
                              populateDualSlot(views, false, minSlot, minStr, null, prevMinStr, null, 240, 250, theme,
                                      R.id.min_top_flipper, R.id.min_bot_flipper,
                                      R.id.min_top_0, R.id.min_bot_0, R.id.min_top_1, R.id.min_bot_1);
                          }
          
                          if (hourDisp != lastRenderedHour) {
                              populateDualSlot(views, false, hourSlot, hourStr, badge, prevHourStr, prevBadge, 240, 250, theme,
                                      R.id.hour_top_flipper, R.id.hour_bot_flipper,
                                      R.id.hour_top_0, R.id.hour_bot_0, R.id.hour_top_1, R.id.hour_bot_1);
                          }
          
                          mgr.partiallyUpdateAppWidget(ids, views);
                      }
          
                      lastRenderedSec = sec;
                      lastRenderedMin = min;
                      lastRenderedHour = hourDisp;
                      lastRenderedTheme = theme;
                      lastRendered24h = use24h;
                  } catch (Exception ignored) {
                  }
              }
          
              private static void populateDualSlot(
                      RemoteViews views,
                      boolean includePrevSlot,
                      int activeSlot,
                      String currText,
                      String currBadge,
                      String prevText,
                      String prevBadge,
                      int cardW,
                      int cardH,
                      int theme,
                      int topFlipperId,
                      int botFlipperId,
                      int top0Id,
                      int bot0Id,
                      int top1Id,
                      int bot1Id
              ) {
                  Bitmap[] currHalves = sharedRenderer.renderCardHalvesForWidget(cardW, cardH, currText, currBadge, theme);
                  if (activeSlot == 0) {
                      views.setImageViewBitmap(top0Id, currHalves[0]);
                      views.setImageViewBitmap(bot0Id, currHalves[1]);
                  } else {
                      views.setImageViewBitmap(top1Id, currHalves[0]);
                      views.setImageViewBitmap(bot1Id, currHalves[1]);
                  }
          
                  if (includePrevSlot) {
                      Bitmap[] prevHalves = sharedRenderer.renderCardHalvesForWidget(cardW, cardH, prevText, prevBadge, theme);
                      if (activeSlot == 0) {
                          views.setImageViewBitmap(top1Id, prevHalves[0]);
                          views.setImageViewBitmap(bot1Id, prevHalves[1]);
                      } else {
                          views.setImageViewBitmap(top0Id, prevHalves[0]);
                          views.setImageViewBitmap(bot0Id, prevHalves[1]);
                      }
                  }
          
                  views.setDisplayedChild(topFlipperId, activeSlot);
                  views.setDisplayedChild(botFlipperId, activeSlot);
              }
          }
