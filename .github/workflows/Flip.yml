          package com.realme.flipclock;
          
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.os.Bundle;
          import android.widget.RemoteViews;
          
          public class FlipOdometerWidgetProvider extends AppWidgetProvider {
          
              public static final String ACTION_WIDGET_TAP = "com.realme.flipclock.ACTION_WIDGET_TAP";
          
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int id : appWidgetIds) {
                      updateWidget(context, appWidgetManager, id);
                  }
              }
          
              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager appWidgetManager, int appWidgetId, Bundle newOptions) {
                  super.onAppWidgetOptionsChanged(context, appWidgetManager, appWidgetId, newOptions);
                  updateWidget(context, appWidgetManager, appWidgetId);
              }
          
              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (intent == null || intent.getAction() == null) {
                      return;
                  }
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, FlipOdometerWidgetProvider.class));
                  for (int id : ids) {
                      updateWidget(context, mgr, id);
                  }
              }
          
              public static void updateAllWidgets(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, FlipOdometerWidgetProvider.class));
                  for (int id : ids) {
                      updateWidget(context, mgr, id);
                  }
              }
          
              public static void updateWidget(Context context, AppWidgetManager mgr, int appWidgetId) {
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_flip);
          
                  Bitmap bmp = Bitmap.createBitmap(900, 380, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  FlipOdometerRenderer renderer = new FlipOdometerRenderer();
                  renderer.drawClock(
                          canvas,
                          900,
                          380,
                          System.currentTimeMillis(),
                          ClockPrefs.getThemeMode(context),
                          ClockPrefs.isShowMsBox(context),
                          ClockPrefs.isUse24Hour(context),
                          ClockPrefs.POS_CENTER,
                          false,
                          0f,
                          0f
                  );
                  views.setImageViewBitmap(R.id.widget_image, bmp);
          
                  Intent launchIntent = new Intent(context, FullScreenClockActivity.class);
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent pi = PendingIntent.getActivity(
                          context,
                          appWidgetId,
                          launchIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  views.setOnClickPendingIntent(R.id.widget_root, pi);
                  views.setOnClickPendingIntent(R.id.widget_image, pi);
          
                  mgr.updateAppWidget(appWidgetId, views);
              }
          }
