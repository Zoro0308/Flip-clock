          package com.realme.flipclock;
          
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Calendar;
          import java.util.Locale;
          
          public class FlipOdometerWidgetProvider extends AppWidgetProvider {
          
              private static final String TAG = "FlipWidgetProvider";
          
              public static final String ACTION_WIDGET_CYCLE_THEME = "com.realme.flipclock.ACTION_WIDGET_CYCLE_THEME";
              public static final String ACTION_WIDGET_OPEN_APP = "com.realme.flipclock.ACTION_WIDGET_OPEN_APP";
              public static final String ACTION_WIDGET_MINUTE_ALARM = "com.realme.flipclock.ACTION_WIDGET_MINUTE_ALARM";
          
              private static final FlipOdometerRenderer sharedRenderer = new FlipOdometerRenderer();
          
              private static int lastRenderedHour = -1;
              private static int lastRenderedMin = -1;
              private static int lastRenderedSec = -1;
              private static boolean lastRendered24h = false;
              private static boolean lastRenderedShowSec = true;
              private static boolean lastRenderedShowDate = false;
          
              @Override
              public void onEnabled(Context context) {
                  super.onEnabled(context);
                  tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                  FlipWidgetService.ensureRunning(context);
              }
          
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                  FlipWidgetService.ensureRunning(context);
              }
          
              @Override
              public void onDeleted(Context context, int[] appWidgetIds) {
                  super.onDeleted(context, appWidgetIds);
                  if (appWidgetIds != null) {
                      for (int id : appWidgetIds) {
                          ClockPrefs.deleteWidgetPrefs(context, id);
                      }
                  }
                  if (!FlipWidgetService.hasActiveWidgets(context)) {
                      Log.i(TAG, "Last widget deleted; stopping FlipWidgetService.");
                      FlipWidgetService.stopServiceIfRunning(context);
                  }
              }
          
              @Override
              public void onDisabled(Context context) {
                  super.onDisabled(context);
                  Log.i(TAG, "All widgets disabled; stopping FlipWidgetService and alarms.");
                  FlipWidgetService.stopServiceIfRunning(context);
              }
          
              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager appWidgetManager, int appWidgetId, Bundle newOptions) {
                  super.onAppWidgetOptionsChanged(context, appWidgetManager, appWidgetId, newOptions);
                  tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                  FlipWidgetService.ensureRunning(context);
              }
          
              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (intent == null || intent.getAction() == null) {
                      return;
                  }
                  String action = intent.getAction();
                  if (ACTION_WIDGET_CYCLE_THEME.equals(action)) {
                      int targetWidgetId = intent.getIntExtra(
                              AppWidgetManager.EXTRA_APPWIDGET_ID,
                              AppWidgetManager.INVALID_APPWIDGET_ID
                      );
                      if (targetWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                          ClockPrefs.cycleWidgetThemeMode(context, targetWidgetId);
                      } else {
                          ClockPrefs.cycleThemeMode(context);
                      }
                      tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                      FlipWidgetService.ensureRunning(context);
                  } else if (ACTION_WIDGET_OPEN_APP.equals(action)) {
                      FlipWidgetService.ensureRunning(context);
                      Intent openApp = new Intent(context, MainActivity.class);
                      openApp.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(openApp);
                  } else if (ACTION_WIDGET_MINUTE_ALARM.equals(action)
                          || Intent.ACTION_TIME_CHANGED.equals(action)
                          || Intent.ACTION_TIMEZONE_CHANGED.equals(action)
                          || Intent.ACTION_DATE_CHANGED.equals(action)) {
                      tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                      FlipWidgetService.ensureRunning(context);
                  }
              }
          
              public static void scheduleMinuteAlarm(Context context) {
                  try {
                      if (!FlipWidgetService.hasActiveWidgets(context)) {
                          return;
                      }
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      long now = System.currentTimeMillis();
                      long nextMinute = ((now / 60000L) + 1L) * 60000L + 50L;
                      Intent intent = new Intent(context, FlipOdometerWidgetProvider.class);
                      intent.setAction(ACTION_WIDGET_MINUTE_ALARM);
                      PendingIntent pi = PendingIntent.getBroadcast(
                              context,
                              901,
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      am.set(AlarmManager.RTC, nextMinute, pi);
                  } catch (Exception e) {
                      Log.w(TAG, "Failed to schedule fallback minute alarm", e);
                  }
              }
          
              public static void cancelMinuteAlarm(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Intent intent = new Intent(context, FlipOdometerWidgetProvider.class);
                      intent.setAction(ACTION_WIDGET_MINUTE_ALARM);
                      PendingIntent pi = PendingIntent.getBroadcast(
                              context,
                              901,
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      am.cancel(pi);
                  } catch (Exception e) {
                      Log.w(TAG, "Failed to cancel fallback minute alarm", e);
                  }
              }
          
              public static void updateAllWidgets(Context context) {
                  tickWidgetOnSecondBoundary(context, System.currentTimeMillis(), true);
                  FlipWidgetService.ensureRunning(context);
              }
          
              public static synchronized void tickWidgetOnSecondBoundary(
                      Context context,
                      long nowMillis,
                      boolean forceFullUpdate
              ) {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      if (mgr == null) return;
                      ComponentName cn = new ComponentName(context, FlipOdometerWidgetProvider.class);
                      int[] ids = mgr.getAppWidgetIds(cn);
                      if (ids == null || ids.length == 0) {
                          FlipWidgetService.stopServiceIfRunning(context);
                          return;
                      }
          
                      boolean use24h = ClockPrefs.isUse24Hour(context);
                      boolean showSeconds = ClockPrefs.isShowSeconds(context);
                      boolean showDate = ClockPrefs.isShowDate(context);
          
                      if (use24h != lastRendered24h
                              || showSeconds != lastRenderedShowSec
                              || showDate != lastRenderedShowDate) {
                          forceFullUpdate = true;
                      }
          
                      Calendar cal = Calendar.getInstance();
                      cal.setTimeInMillis(nowMillis);
          
                      int sec = cal.get(Calendar.SECOND);
                      int min = cal.get(Calendar.MINUTE);
                      int hour24 = cal.get(Calendar.HOUR_OF_DAY);
                      boolean isPm = (hour24 >= 12);
                      int hourDisp = use24h ? hour24 : (hour24 % 12 == 0 ? 12 : hour24 % 12);
          
                      if (!forceFullUpdate && sec == lastRenderedSec && min == lastRenderedMin && hourDisp == lastRenderedHour) {
                          return;
                      }
          
                      Calendar prevCal = Calendar.getInstance();
                      prevCal.setTimeInMillis(nowMillis - 1000L);
                      int prevSec = prevCal.get(Calendar.SECOND);
                      int prevMin = prevCal.get(Calendar.MINUTE);
                      int prevHour24 = prevCal.get(Calendar.HOUR_OF_DAY);
                      boolean prevIsPm = (prevHour24 >= 12);
                      int prevHourDisp = use24h ? prevHour24 : (prevHour24 % 12 == 0 ? 12 : prevHour24 % 12);
          
                      String hourStr = use24h ? String.format(Locale.US, "%02d", hourDisp) : String.valueOf(hourDisp);
                      String prevHourStr = use24h ? String.format(Locale.US, "%02d", prevHourDisp) : String.valueOf(prevHourDisp);
                      String badge = use24h ? null : (isPm ? "PM" : "AM");
                      String prevBadge = use24h ? null : (prevIsPm ? "PM" : "AM");
          
                      String minStr = String.format(Locale.US, "%02d", min);
                      String prevMinStr = String.format(Locale.US, "%02d", prevMin);
          
                      String secStr = String.format(Locale.US, "%02d", sec);
                      String prevSecStr = String.format(Locale.US, "%02d", prevSec);
          
                      int secSlot = sec % 2;
                      int minSlot = min % 2;
                      int hourSlot = hourDisp % 2;
                      String dateHeader = showDate ? FlipOdometerRenderer.formatDateHeader(nowMillis) : "";
          
                      // Update each widget instance independently so per-widget themes work seamlessly
                      for (int appWidgetId : ids) {
                          int widgetTheme = ClockPrefs.getWidgetThemeMode(context, appWidgetId);
                          RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_flip);
          
                          if (forceFullUpdate) {
                              int bgRes;
                              if (widgetTheme == ClockPrefs.MODE_AMOLED_DARK) {
                                  bgRes = R.drawable.widget_bg_dark;
                              } else if (widgetTheme == ClockPrefs.MODE_WHITE_LIGHT) {
                                  bgRes = R.drawable.widget_bg_light;
                              } else {
                                  bgRes = R.drawable.widget_bg_trans;
                              }
                              views.setInt(R.id.widget_root, "setBackgroundResource", bgRes);
          
                              // Optional date display
                              if (showDate) {
                                  views.setViewVisibility(R.id.widget_date_text, View.VISIBLE);
                                  views.setTextViewText(R.id.widget_date_text, dateHeader);
                                  int dateColor = (widgetTheme == ClockPrefs.MODE_WHITE_LIGHT
                                          || widgetTheme == ClockPrefs.MODE_TRANS_DARK_TEXT)
                                          ? Color.parseColor("#334155")
                                          : Color.parseColor("#CBD5E1");
                                  views.setTextColor(R.id.widget_date_text, dateColor);
                              } else {
                                  views.setViewVisibility(R.id.widget_date_text, View.GONE);
                              }
          
                              // Show / Hide Seconds card
                              int secVis = showSeconds ? View.VISIBLE : View.GONE;
                              views.setViewVisibility(R.id.sec_spacer, secVis);
                              views.setViewVisibility(R.id.sec_column_box, secVis);
          
                              populateDualSlot(views, true, hourSlot, hourStr, badge, prevHourStr, prevBadge, 240, 250, widgetTheme,
                                      R.id.hour_top_flipper, R.id.hour_bot_flipper,
                                      R.id.hour_top_0, R.id.hour_bot_0, R.id.hour_top_1, R.id.hour_bot_1);
          
                              populateDualSlot(views, true, minSlot, minStr, null, prevMinStr, null, 240, 250, widgetTheme,
                                      R.id.min_top_flipper, R.id.min_bot_flipper,
                                      R.id.min_top_0, R.id.min_bot_0, R.id.min_top_1, R.id.min_bot_1);
          
                              if (showSeconds) {
                                  populateDualSlot(views, true, secSlot, secStr, null, prevSecStr, null, 130, 136, widgetTheme,
                                          R.id.sec_top_flipper, R.id.sec_bot_flipper,
                                          R.id.sec_top_0, R.id.sec_bot_0, R.id.sec_top_1, R.id.sec_bot_1);
                              }
          
                              // Per-widget PendingIntent with EXTRA_APPWIDGET_ID so tapping cycles only THIS widget's theme
                              Intent cycleIntent = new Intent(context, FlipOdometerWidgetProvider.class);
                              cycleIntent.setAction(ACTION_WIDGET_CYCLE_THEME);
                              cycleIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                              PendingIntent cyclePi = PendingIntent.getBroadcast(
                                      context, 10000 + appWidgetId, cycleIntent,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              views.setOnClickPendingIntent(R.id.widget_left_tap, cyclePi);
          
                              Intent openIntent = new Intent(context, FlipOdometerWidgetProvider.class);
                              openIntent.setAction(ACTION_WIDGET_OPEN_APP);
                              openIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                              PendingIntent openPi = PendingIntent.getBroadcast(
                                      context, 20000 + appWidgetId, openIntent,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              views.setOnClickPendingIntent(R.id.widget_right_tap, openPi);
          
                              mgr.updateAppWidget(appWidgetId, views);
                          } else {
                              boolean changed = false;
                              if (showSeconds && !ClockPrefs.isBatterySaverMode(context)) {
                                  populateDualSlot(views, false, secSlot, secStr, null, prevSecStr, null, 130, 136, widgetTheme,
                                          R.id.sec_top_flipper, R.id.sec_bot_flipper,
                                          R.id.sec_top_0, R.id.sec_bot_0, R.id.sec_top_1, R.id.sec_bot_1);
                                  changed = true;
                              }
          
                              if (min != lastRenderedMin) {
                                  populateDualSlot(views, false, minSlot, minStr, null, prevMinStr, null, 240, 250, widgetTheme,
                                          R.id.min_top_flipper, R.id.min_bot_flipper,
                                          R.id.min_top_0, R.id.min_bot_0, R.id.min_top_1, R.id.min_bot_1);
                                  changed = true;
                              }
          
                              if (hourDisp != lastRenderedHour) {
                                  populateDualSlot(views, false, hourSlot, hourStr, badge, prevHourStr, prevBadge, 240, 250, widgetTheme,
                                          R.id.hour_top_flipper, R.id.hour_bot_flipper,
                                          R.id.hour_top_0, R.id.hour_bot_0, R.id.hour_top_1, R.id.hour_bot_1);
                                  if (showDate) {
                                      views.setTextViewText(R.id.widget_date_text, dateHeader);
                                  }
                                  changed = true;
                              }
          
                              if (changed) {
                                  mgr.partiallyUpdateAppWidget(appWidgetId, views);
                              }
                          }
                      }
          
                      lastRenderedSec = sec;
                      lastRenderedMin = min;
                      lastRenderedHour = hourDisp;
                      lastRendered24h = use24h;
                      lastRenderedShowSec = showSeconds;
                      lastRenderedShowDate = showDate;
                  } catch (Exception e) {
                      Log.e(TAG, "Error updating home screen flip clock widget", e);
                  }
              }
          
              private static void populateDualSlot(
                      RemoteViews views,
                      boolean includePrevSlot,
                      int activeSlot,
                      String currText,
                      String currBadge,
                      String prevText,
                      String prevBadge,
                      int cardW,
                      int cardH,
                      int theme,
                      int topFlipperId,
                      int botFlipperId,
                      int top0Id,
                      int bot0Id,
                      int top1Id,
                      int bot1Id
              ) {
                  Bitmap[] currHalves = sharedRenderer.renderCardHalvesForWidget(cardW, cardH, currText, currBadge, theme);
                  if (activeSlot == 0) {
                      views.setImageViewBitmap(top0Id, currHalves[0]);
                      views.setImageViewBitmap(bot0Id, currHalves[1]);
                  } else {
                      views.setImageViewBitmap(top1Id, currHalves[0]);
                      views.setImageViewBitmap(bot1Id, currHalves[1]);
                  }
          
                  if (includePrevSlot) {
                      Bitmap[] prevHalves = sharedRenderer.renderCardHalvesForWidget(cardW, cardH, prevText, prevBadge, theme);
                      if (activeSlot == 0) {
                          views.setImageViewBitmap(top1Id, prevHalves[0]);
                          views.setImageViewBitmap(bot1Id, prevHalves[1]);
                      } else {
                          views.setImageViewBitmap(top0Id, prevHalves[0]);
                          views.setImageViewBitmap(bot0Id, prevHalves[1]);
                      }
                  }
          
                  views.setDisplayedChild(topFlipperId, activeSlot);
                  views.setDisplayedChild(botFlipperId, activeSlot);
              }
          }
