          package com.realme.flipclock;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Canvas;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.wallpaper.WallpaperService;
          import android.util.Log;
          import android.view.Choreographer;
          import android.view.MotionEvent;
          import android.view.SurfaceHolder;
          
          public class FlipOdometerWallpaperService extends WallpaperService {
          
              private static final String TAG = "FlipWallpaperService";
          
              @Override
              public Engine onCreateEngine() {
                  return new FlipClockEngine();
              }
          
              private class FlipClockEngine extends Engine implements Choreographer.FrameCallback {
          
                  private final FlipOdometerRenderer renderer = new FlipOdometerRenderer();
                  private final Handler handler = new Handler(Looper.getMainLooper());
                  private boolean visible = false;
                  private boolean timeReceiverRegistered = false;
                  private long lastTapTime = 0L;
          
                  private final Runnable wakeupRunnable = new Runnable() {
                      @Override
                      public void run() {
                          handler.removeCallbacks(this);
                          if (!visible) {
                              return;
                          }
                          Choreographer.getInstance().removeFrameCallback(FlipClockEngine.this);
                          Choreographer.getInstance().postFrameCallback(FlipClockEngine.this);
                      }
                  };
          
                  private final BroadcastReceiver timeReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (visible) {
                              scheduleNextRender(0L);
                          }
                      }
                  };
          
                  @Override
                  public void onCreate(SurfaceHolder surfaceHolder) {
                      super.onCreate(surfaceHolder);
                      setTouchEventsEnabled(true);
                  }
          
                  @Override
                  public void onVisibilityChanged(boolean visible) {
                      this.visible = visible;
                      if (visible) {
                          registerTimeReceiver();
                          scheduleNextRender(0L);
                      } else {
                          unregisterTimeReceiver();
                          handler.removeCallbacksAndMessages(null);
                          Choreographer.getInstance().removeFrameCallback(this);
                      }
                  }
          
                  @Override
                  public void onSurfaceDestroyed(SurfaceHolder holder) {
                      super.onSurfaceDestroyed(holder);
                      this.visible = false;
                      unregisterTimeReceiver();
                      handler.removeCallbacksAndMessages(null);
                      Choreographer.getInstance().removeFrameCallback(this);
                  }
          
                  @Override
                  public void onTouchEvent(MotionEvent event) {
                      super.onTouchEvent(event);
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          long now = System.currentTimeMillis();
                          if (now - lastTapTime < 350L) {
                              ClockPrefs.cycleThemeMode(getApplicationContext());
                              lastTapTime = 0L;
                              scheduleNextRender(0L);
                          } else {
                              lastTapTime = now;
                          }
                      }
                  }
          
                  @Override
                  public void doFrame(long frameTimeNanos) {
                      if (!visible) {
                          return;
                      }
                      long now = System.currentTimeMillis();
                      drawWallpaperFrame(now);
          
                      Context ctx = getApplicationContext();
                      long nextDelayMs = FlipOdometerRenderer.computeNextFrameDelayMs(
                              now,
                              ClockPrefs.getFlipDurationMs(ctx),
                              ClockPrefs.isShowSeconds(ctx),
                              ClockPrefs.isBatterySaverMode(ctx)
                      );
                      scheduleNextRender(nextDelayMs);
                  }
          
                  private void scheduleNextRender(long delayMs) {
                      handler.removeCallbacks(wakeupRunnable);
                      Choreographer.getInstance().removeFrameCallback(this);
                      if (!visible) {
                          return;
                      }
                      if (delayMs <= 0L) {
                          Choreographer.getInstance().postFrameCallback(this);
                      } else {
                          handler.postDelayed(wakeupRunnable, delayMs);
                      }
                  }
          
                  private void registerTimeReceiver() {
                      if (!timeReceiverRegistered) {
                          try {
                              IntentFilter filter = new IntentFilter();
                              filter.addAction(Intent.ACTION_TIME_CHANGED);
                              filter.addAction(Intent.ACTION_TIMEZONE_CHANGED);
                              filter.addAction(Intent.ACTION_DATE_CHANGED);
                              registerReceiver(timeReceiver, filter);
                              timeReceiverRegistered = true;
                          } catch (Exception e) {
                              Log.w(TAG, "Error registering wallpaper time receiver", e);
                          }
                      }
                  }
          
                  private void unregisterTimeReceiver() {
                      if (timeReceiverRegistered) {
                          try {
                              unregisterReceiver(timeReceiver);
                          } catch (Exception e) {
                              Log.w(TAG, "Error unregistering wallpaper time receiver", e);
                          }
                          timeReceiverRegistered = false;
                      }
                  }
          
                  private void drawWallpaperFrame(long now) {
                      SurfaceHolder holder = getSurfaceHolder();
                      Canvas canvas = null;
                      try {
                          canvas = holder.lockCanvas();
                          if (canvas != null) {
                              Context ctx = getApplicationContext();
                              int theme = ClockPrefs.getThemeMode(ctx);
                              boolean use24h = ClockPrefs.isUse24Hour(ctx);
                              int vPos = ClockPrefs.getVerticalPos(ctx);
                              float shiftX = ClockPrefs.getAmoledShiftX(ctx, now);
                              float shiftY = ClockPrefs.getAmoledShiftY(ctx, now);
          
                              if (!ClockPrefs.hasCustomBackground(ctx)) {
                                  if (theme == ClockPrefs.MODE_TRANS_LIGHT_TEXT) {
                                      canvas.drawColor(0xFF0B0F17);
                                  } else if (theme == ClockPrefs.MODE_TRANS_DARK_TEXT) {
                                      canvas.drawColor(0xFFE2E8F0);
                                  }
                              }
          
                              renderer.drawClock(
                                      ctx,
                                      canvas,
                                      canvas.getWidth(),
                                      canvas.getHeight(),
                                      now,
                                      theme,
                                      use24h,
                                      vPos,
                                      false,
                                      shiftX,
                                      shiftY
                              );
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "Error drawing live wallpaper frame", e);
                      } finally {
                          if (canvas != null) {
                              try {
                                  holder.unlockCanvasAndPost(canvas);
                              } catch (Exception e) {
                                  Log.w(TAG, "Error unlocking wallpaper canvas", e);
                              }
                          }
                      }
                  }
              }
          }
