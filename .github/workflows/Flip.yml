          package com.realme.flipclock;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.appwidget.AppWidgetManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          
          public class FlipWidgetService extends Service {
          
              private static final String CHANNEL_ID = "flip_widget_live_channel";
              private static final int NOTIF_ID = 101;
          
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean screenReceiverRegistered = false;
          
              private final Runnable tickRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (!hasActiveWidgets() || !isScreenInteractive()) {
                          return;
                      }
                      long now = System.currentTimeMillis();
                      FlipOdometerWidgetProvider.pushWidgetFrame(FlipWidgetService.this, now);
          
                      // Schedule key 3D flip animation frames within the first 440ms of each second,
                      // then sleep until the exact start of the next second!
                      long msInSecond = now % 1000L;
                      long delay;
                      if (msInSecond < 110L) {
                          delay = 115L - msInSecond; // Frame 1: Upper flap falling forward
                      } else if (msInSecond < 250L) {
                          delay = 255L - msInSecond; // Frame 2: Lower flap swinging down (just like 1000386934.jpg)
                      } else if (msInSecond < 450L) {
                          delay = 460L - msInSecond; // Frame 3: Flap landed flat
                      } else {
                          delay = 1005L - msInSecond; // Wait until start of next second
                      }
                      handler.postDelayed(this, Math.max(40L, delay));
                  }
              };
          
              private final BroadcastReceiver screenReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent == null || intent.getAction() == null) {
                          return;
                      }
                      if (Intent.ACTION_SCREEN_OFF.equals(intent.getAction())) {
                          handler.removeCallbacks(tickRunnable);
                      } else if (Intent.ACTION_SCREEN_ON.equals(intent.getAction())) {
                          handler.removeCallbacks(tickRunnable);
                          handler.post(tickRunnable);
                      }
                  }
              };
          
              @Override
              public void onCreate() {
                  super.onCreate();
                  startForegroundSafely();
                  registerScreenReceiver();
              }
          
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForegroundSafely();
                  handler.removeCallbacks(tickRunnable);
                  if (hasActiveWidgets() && isScreenInteractive()) {
                      handler.post(tickRunnable);
                  }
                  return START_STICKY;
              }
          
              @Override
              public void onDestroy() {
                  handler.removeCallbacks(tickRunnable);
                  if (screenReceiverRegistered) {
                      try {
                          unregisterReceiver(screenReceiver);
                      } catch (Exception ignored) {
                      }
                      screenReceiverRegistered = false;
                  }
                  super.onDestroy();
              }
          
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          
              private void startForegroundSafely() {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID,
                                  "Flip Clock Widget Live Ticker",
                                  NotificationManager.IMPORTANCE_MIN
                          );
                          channel.setShowBadge(false);
                          nm.createNotificationChannel(channel);
                      }
                      Notification notif = new Notification.Builder(this, CHANNEL_ID)
                              .setContentTitle("3D Flip Clock Widget Active")
                              .setContentText("Animating live second flips while screen is on")
                              .setSmallIcon(R.drawable.ic_launcher)
                              .setOngoing(true)
                              .build();
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } catch (Exception ignored) {
                  }
              }
          
              private void registerScreenReceiver() {
                  if (!screenReceiverRegistered) {
                      try {
                          IntentFilter filter = new IntentFilter();
                          filter.addAction(Intent.ACTION_SCREEN_ON);
                          filter.addAction(Intent.ACTION_SCREEN_OFF);
                          registerReceiver(screenReceiver, filter);
                          screenReceiverRegistered = true;
                      } catch (Exception ignored) {
                      }
                  }
              }
          
              private boolean isScreenInteractive() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      return pm == null || pm.isInteractive();
                  } catch (Exception e) {
                      return true;
                  }
              }
          
              private boolean hasActiveWidgets() {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(this);
                      int[] ids = mgr.getAppWidgetIds(new ComponentName(this, FlipOdometerWidgetProvider.class));
                      return ids != null && ids.length > 0;
                  } catch (Exception e) {
                      return false;
                  }
              }
          
              public static void ensureRunning(Context context) {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      int[] ids = mgr.getAppWidgetIds(new ComponentName(context, FlipOdometerWidgetProvider.class));
                      if (ids != null && ids.length > 0) {
                          Intent s = new Intent(context, FlipWidgetService.class);
                          context.startForegroundService(s);
                      }
                  } catch (Exception ignored) {
                      try {
                          Intent s = new Intent(context, FlipWidgetService.class);
                          context.startService(s);
                      } catch (Exception ignored2) {
                      }
                  }
              }
          }
