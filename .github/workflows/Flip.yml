name: Build Realme 60fps 3D Flip Clock APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Flip Clock Project Files
        run: |
          mkdir -p flip_clock_build
          cd flip_clock_build
          cat << 'EOF_FILE' > "settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RealmeFlipOdometerClock"
          include ':app'
          EOF_FILE

          cat << 'EOF_FILE' > "build.gradle"
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE

          cat << 'EOF_FILE' > "gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF_FILE

          mkdir -p "app"
          cat << 'EOF_FILE' > "app/build.gradle"
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.realme.flipclock'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.realme.flipclock"
                  minSdk 31
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
          
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
          }
          EOF_FILE

          mkdir -p "app/src/main"
          cat << 'EOF_FILE' > "app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
          
              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="false" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".FullScreenClockActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar.Fullscreen"
                      android:label="@string/app_name" />
          
                  <service
                      android:name=".FlipOdometerWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/wallpaper_label"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper_info" />
                  </service>
          
                  <service
                      android:name=".FlipWidgetService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="60fps hardware-accelerated ViewFlipper home screen clock widget" />
                  </service>
          
                  <receiver
                      android:name=".FlipOdometerWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_label">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_CYCLE_THEME" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_OPEN_APP" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/flip_widget_info" />
                  </receiver>
          
              </application>
          </manifest>
          EOF_FILE

          mkdir -p "app/src/main/res/values"
          cat << 'EOF_FILE' > "app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">3D Flip Clock</string>
              <string name="wallpaper_label">3D Split-Flap Live Wallpaper</string>
              <string name="wallpaper_description">60fps hardware-accelerated 3D split-flap flip clock (Hours, Minutes, Seconds) with Gallery photo picker, Dark AMOLED, White, and Transparent modes.</string>
              <string name="widget_label">3D Flip Clock Widget (60fps Smooth)</string>
          </resources>
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/wallpaper_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description"
              android:settingsActivity="com.realme.flipclock.MainActivity"
              android:thumbnail="@drawable/ic_launcher" />
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/flip_widget_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:minResizeWidth="180dp"
              android:minResizeHeight="80dp"
              android:maxResizeWidth="900dp"
              android:maxResizeHeight="500dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_flip"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/wallpaper_description" />
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_top_out.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="top">
              <scale
                  android:interpolator="@android:anim/accelerate_interpolator"
                  android:fromXScale="1.0"
                  android:toXScale="1.0"
                  android:fromYScale="1.0"
                  android:toYScale="0.0"
                  android:pivotX="50%"
                  android:pivotY="100%"
                  android:duration="170" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_top_in.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="bottom">
              <alpha
                  android:fromAlpha="0.6"
                  android:toAlpha="1.0"
                  android:duration="170" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_bot_in.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="top"
              android:fillBefore="true"
              android:fillEnabled="true">
              <scale
                  android:interpolator="@android:anim/decelerate_interpolator"
                  android:startOffset="165"
                  android:fromXScale="1.0"
                  android:toXScale="1.0"
                  android:fromYScale="0.0"
                  android:toYScale="1.0"
                  android:pivotX="50%"
                  android:pivotY="0%"
                  android:duration="180"
                  android:fillBefore="true"
                  android:fillEnabled="true" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/anim"
          cat << 'EOF_FILE' > "app/src/main/res/anim/flap_bot_out.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:shareInterpolator="false"
              android:zAdjustment="bottom">
              <alpha
                  android:startOffset="165"
                  android:fromAlpha="1.0"
                  android:toAlpha="0.35"
                  android:duration="180" />
          </set>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/widget_bg_dark.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/widget_bg_light.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F2F2F7" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/widget_bg_trans.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#00000000" />
              <corners android:radius="24dp" />
          </shape>
          EOF_FILE

          mkdir -p "app/src/main/res/layout"
          cat << 'EOF_FILE' > "app/src/main/res/layout/widget_flip.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg_dark"
              android:padding="10dp">
          
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="horizontal"
                  android:weightSum="264"
                  android:gravity="center">
          
                  <!-- CARD 1: HOURS (Top Half ViewFlipper + Bottom Half ViewFlipper) -->
                  <LinearLayout
                      android:id="@+id/hour_card_box"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="100"
                      android:orientation="vertical"
                      android:weightSum="2">
          
                      <ViewFlipper
                          android:id="@+id/hour_top_flipper"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:inAnimation="@anim/flap_top_in"
                          android:outAnimation="@anim/flap_top_out">
                          <ImageView
                              android:id="@+id/hour_top_0"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                          <ImageView
                              android:id="@+id/hour_top_1"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                      </ViewFlipper>
          
                      <ViewFlipper
                          android:id="@+id/hour_bot_flipper"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:inAnimation="@anim/flap_bot_in"
                          android:outAnimation="@anim/flap_bot_out">
                          <ImageView
                              android:id="@+id/hour_bot_0"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                          <ImageView
                              android:id="@+id/hour_bot_1"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                      </ViewFlipper>
                  </LinearLayout>
          
                  <FrameLayout
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="6" />
          
                  <!-- CARD 2: MINUTES (Top Half ViewFlipper + Bottom Half ViewFlipper) -->
                  <LinearLayout
                      android:id="@+id/min_card_box"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="100"
                      android:orientation="vertical"
                      android:weightSum="2">
          
                      <ViewFlipper
                          android:id="@+id/min_top_flipper"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:inAnimation="@anim/flap_top_in"
                          android:outAnimation="@anim/flap_top_out">
                          <ImageView
                              android:id="@+id/min_top_0"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                          <ImageView
                              android:id="@+id/min_top_1"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                      </ViewFlipper>
          
                      <ViewFlipper
                          android:id="@+id/min_bot_flipper"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:inAnimation="@anim/flap_bot_in"
                          android:outAnimation="@anim/flap_bot_out">
                          <ImageView
                              android:id="@+id/min_bot_0"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                          <ImageView
                              android:id="@+id/min_bot_1"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:scaleType="fitXY"
                              android:contentDescription="@string/app_name" />
                      </ViewFlipper>
                  </LinearLayout>
          
                  <FrameLayout
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="6" />
          
                  <!-- CARD 3: SECONDS (Bottom-Right Corner, matching 1000386934.jpg) -->
                  <LinearLayout
                      android:id="@+id/sec_column_box"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="52"
                      android:orientation="vertical"
                      android:weightSum="100">
          
                      <FrameLayout
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="50" />
          
                      <LinearLayout
                          android:id="@+id/sec_card_box"
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="50"
                          android:orientation="vertical"
                          android:weightSum="2">
          
                          <ViewFlipper
                              android:id="@+id/sec_top_flipper"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="1"
                              android:inAnimation="@anim/flap_top_in"
                              android:outAnimation="@anim/flap_top_out">
                              <ImageView
                                  android:id="@+id/sec_top_0"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                              <ImageView
                                  android:id="@+id/sec_top_1"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                          </ViewFlipper>
          
                          <ViewFlipper
                              android:id="@+id/sec_bot_flipper"
                              android:layout_width="match_parent"
                              android:layout_height="0dp"
                              android:layout_weight="1"
                              android:inAnimation="@anim/flap_bot_in"
                              android:outAnimation="@anim/flap_bot_out">
                              <ImageView
                                  android:id="@+id/sec_bot_0"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                              <ImageView
                                  android:id="@+id/sec_bot_1"
                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:scaleType="fitXY"
                                  android:contentDescription="@string/app_name" />
                          </ViewFlipper>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          
              <!-- Transparent Tap Zones over Left (Cycle Theme) and Right (Open App) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="horizontal"
                  android:weightSum="3">
          
                  <FrameLayout
                      android:id="@+id/widget_left_tap"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="2" />
          
                  <FrameLayout
                      android:id="@+id/widget_right_tap"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1" />
              </LinearLayout>
          </FrameLayout>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M18,0 L90,0 A18,18 0 0,1 108,18 L108,90 A18,18 0 0,1 90,108 L18,108 A18,18 0 0,1 0,90 L0,18 A18,18 0 0,1 18,0 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M14,26 L50,26 A6,6 0 0,1 56,32 L56,76 A6,6 0 0,1 50,82 L14,82 A6,6 0 0,1 8,76 L8,32 A6,6 0 0,1 14,26 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M64,26 L94,26 A6,6 0 0,1 100,32 L100,76 A6,6 0 0,1 94,82 L64,82 A6,6 0 0,1 58,76 L58,32 A6,6 0 0,1 64,26 Z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M24,40 L24,68 M40,40 L40,68 M72,40 L86,40 L86,54 L72,54 L72,68 L86,68" />
              <path
                  android:strokeColor="#000000"
                  android:strokeWidth="2.5"
                  android:pathData="M8,54 L100,54" />
          </vector>
          EOF_FILE

          mkdir -p "app/src/main/java/com/realme/flipclock"
          cat << 'EOF_FILE' > "app/src/main/java/com/realme/flipclock/ClockPrefs.java"
          package com.realme.flipclock;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          
          public class ClockPrefs {
          
              public static final String PREFS_NAME = "FlipClockV3Prefs";
              public static final String KEY_THEME_MODE = "theme_mode";
              public static final String KEY_USE_24H = "use_24h";
              public static final String KEY_VERTICAL_POS = "vertical_pos";
              public static final String KEY_HAS_CUSTOM_BG = "has_custom_bg";
              public static final String KEY_CUSTOM_BG_STAMP = "custom_bg_stamp";
              public static final String CUSTOM_BG_FILENAME = "custom_wallpaper_bg.jpg";
          
              public static final int MODE_AMOLED_DARK = 0;
              public static final int MODE_WHITE_LIGHT = 1;
              public static final int MODE_TRANS_LIGHT_TEXT = 2;
              public static final int MODE_TRANS_DARK_TEXT = 3;
          
              public static final int POS_TOP_WIDGET = 0;
              public static final int POS_CENTER = 1;
              public static final int POS_BOTTOM = 2;
          
              public static int getThemeMode(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getInt(KEY_THEME_MODE, MODE_AMOLED_DARK);
              }
          
              public static void setThemeMode(Context context, int mode) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putInt(KEY_THEME_MODE, (mode % 4 + 4) % 4)
                          .apply();
              }
          
              public static int cycleThemeMode(Context context) {
                  int next = (getThemeMode(context) + 1) % 4;
                  setThemeMode(context, next);
                  return next;
              }
          
              public static boolean isUse24Hour(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getBoolean(KEY_USE_24H, false);
              }
          
              public static void setUse24Hour(Context context, boolean use24h) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putBoolean(KEY_USE_24H, use24h)
                          .apply();
              }
          
              public static int getVerticalPos(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getInt(KEY_VERTICAL_POS, POS_TOP_WIDGET);
              }
          
              public static void setVerticalPos(Context context, int pos) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putInt(KEY_VERTICAL_POS, pos)
                          .apply();
              }
          
              public static boolean hasCustomBackground(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  File f = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                  return p.getBoolean(KEY_HAS_CUSTOM_BG, false) && f.exists();
              }
          
              public static long getCustomBgStamp(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getLong(KEY_CUSTOM_BG_STAMP, 0L);
              }
          
              public static void clearCustomBackground(Context context) {
                  File f = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                  if (f.exists()) {
                      f.delete();
                  }
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putBoolean(KEY_HAS_CUSTOM_BG, false)
                          .putLong(KEY_CUSTOM_BG_STAMP, System.currentTimeMillis())
                          .apply();
              }
          
              public static boolean saveCustomBackgroundFromUri(Context context, Uri uri) {
                  if (uri == null) {
                      return false;
                  }
                  InputStream in1 = null;
                  InputStream in2 = null;
                  FileOutputStream fos = null;
                  try {
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      in1 = context.getContentResolver().openInputStream(uri);
                      BitmapFactory.decodeStream(in1, null, bounds);
                      if (in1 != null) {
                          in1.close();
                          in1 = null;
                      }
          
                      int maxDim = Math.max(bounds.outWidth, bounds.outHeight);
                      int sampleSize = 1;
                      while (maxDim / sampleSize > 2048) {
                          sampleSize *= 2;
                      }
          
                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      opts.inSampleSize = sampleSize;
                      in2 = context.getContentResolver().openInputStream(uri);
                      Bitmap decoded = BitmapFactory.decodeStream(in2, null, opts);
                      if (decoded == null) {
                          return false;
                      }
          
                      File outFile = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                      fos = new FileOutputStream(outFile);
                      decoded.compress(Bitmap.CompressFormat.JPEG, 90, fos);
                      fos.flush();
                      decoded.recycle();
          
                      context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                              .edit()
                              .putBoolean(KEY_HAS_CUSTOM_BG, true)
                              .putLong(KEY_CUSTOM_BG_STAMP, System.currentTimeMillis())
                              .apply();
                      return true;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      try {
                          if (in1 != null) in1.close();
                      } catch (Exception ignored) {
                      }
                      try {
                          if (in2 != null) in2.close();
                      } catch (Exception ignored) {
                      }
                      try {
                          if (fos != null) fos.close();
                      } catch (Exception ignored) {
                      }
                  }
              }
          
              public static Bitmap loadCustomBackgroundBitmap(Context context) {
                  try {
                      File f = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                      if (!f.exists()) {
                          return null;
                      }
                      return BitmapFactory.decodeFile(f.getAbsolutePath());
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
