                  root.addView(setWpBtn);
          
                  // 3. Choose Custom Background Image from Gallery / File Manager
                  root.addView(makeSectionHeader("Custom Background from Gallery / File Manager (for Live Wallpaper & Full-Screen):"));
                  LinearLayout bgRow = new LinearLayout(this);
                  bgRow.setOrientation(LinearLayout.HORIZONTAL);
                  bgRow.setGravity(Gravity.CENTER);
          
                  Button pickGalleryBtn = makeButton("Choose Photo from Gallery / Files", "#6366F1", "#FFFFFF");
                  pickGalleryBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          openGalleryFilePicker();
