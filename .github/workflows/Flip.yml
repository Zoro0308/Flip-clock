              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_PICK_BACKGROUND_IMAGE && resultCode == Activity.RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      if (ClockPrefs.saveCustomBackgroundFromUri(this, uri)) {
                          Toast.makeText(this, "Custom gallery background saved!", Toast.LENGTH_LONG).show();
                          refreshStatus();
                      } else {
                          Toast.makeText(this, "Could not load selected image", Toast.LENGTH_SHORT).show();
                      }
                  }
              }
          
              private void openGalleryFilePicker() {
                  try {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("image/*");
                      startActivityForResult(intent, REQ_PICK_BACKGROUND_IMAGE);
                  } catch (Exception e) {
                      try {
                          Intent fallback = new Intent(Intent.ACTION_GET_CONTENT);
                          fallback.setType("image/*");
                          startActivityForResult(fallback, REQ_PICK_BACKGROUND_IMAGE);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Unable to open Gallery/File Manager", Toast.LENGTH_SHORT).show();
                      }
                  }
              }
          
              private void requestPinFlipWidget() {
                  FlipWidgetService.ensureRunning(this);
                  AppWidgetManager mgr = AppWidgetManager.getInstance(this);
                  ComponentName cn = new ComponentName(this, FlipOdometerWidgetProvider.class);
                  if (mgr.isRequestPinAppWidgetSupported()) {
                      mgr.requestPinAppWidget(cn, null, null);
                  } else {
                      Toast.makeText(this, "Long-press Home Screen -> Widgets -> 3D Flip Clock", Toast.LENGTH_LONG).show();
                  }
              }
          
              private TextView makeSectionHeader(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.parseColor("#CBD5E1"));
                  tv.setTextSize(13f);
                  tv.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  tv.setPadding(0, dp(14), 0, dp(6));
                  return tv;
              }
          
              private Button makeButton(String text, String bgHex, String fgHex) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(Color.parseColor(fgHex));
                  b.setTextSize(13f);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(bgHex));
                  gd.setCornerRadius(dp(12));
                  b.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  lp.setMargins(dp(4), dp(4), dp(4), dp(4));
                  b.setLayoutParams(lp);
                  b.setPadding(dp(14), dp(10), dp(14), dp(10));
                  return b;
              }
          
              private Button makeThemeBtn(final String name, final int mode) {
                  Button b = makeButton(name, "#1E293B", "#F8FAFC");
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          ClockPrefs.setThemeMode(MainActivity.this, mode);
                          FlipOdometerWidgetProvider.updateAllWidgets(MainActivity.this);
                          refreshStatus();
                      }
                  });
                  return b;
              }
          
              private Button makePosBtn(final String label, final int pos) {
                  Button b = makeButton(label, "#1E293B", "#F8FAFC");
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          ClockPrefs.setVerticalPos(MainActivity.this, pos);
                          refreshStatus();
                          Toast.makeText(MainActivity.this, "Wallpaper Clock Position: " + label, Toast.LENGTH_SHORT).show();
                      }
                  });
                  return b;
              }
          
              private void refreshStatus() {
                  String[] modeNames = {"AMOLED Dark", "White Mode", "Transparent (Light)", "Transparent (Dark)"};
                  String[] posNames = {"Top", "Center", "Bottom"};
                  int m = ClockPrefs.getThemeMode(this);
                  boolean h24 = ClockPrefs.isUse24Hour(this);
                  int pos = ClockPrefs.getVerticalPos(this);
                  boolean hasBg = ClockPrefs.hasCustomBackground(this);
                  statusLabel.setText(
                          "Active: " + modeNames[m]
                          + (hasBg ? " + Custom Gallery Photo" : "")
                          + " • " + (h24 ? "24-Hour" : "12-Hour AM/PM")
                          + " • Pos: " + posNames[pos]
                  );
              }
          
              private void openLiveWallpaperPicker() {
                  try {
                      Intent intent = new Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);
                      intent.putExtra(
                              WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                              new ComponentName(this, FlipOdometerWallpaperService.class)
                      );
                      startActivity(intent);
                  } catch (Exception e) {
                      try {
                          Intent fallback = new Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER);
                          startActivity(fallback);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Long-press Home Screen -> Wallpapers -> Live Wallpapers", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          
              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }
          
              private static class LivePreviewView extends View implements Choreographer.FrameCallback {
          
                  private final FlipOdometerRenderer renderer = new FlipOdometerRenderer();
                  private boolean active = false;
          
                  public LivePreviewView(Context context) {
                      super(context);
                  }
          
                  public void start() {
                      if (!active) {
                          active = true;
                          Choreographer.getInstance().postFrameCallback(this);
                      }
                  }
          
                  public void stop() {
                      active = false;
                      Choreographer.getInstance().removeFrameCallback(this);
                  }
          
                  @Override
                  public void doFrame(long frameTimeNanos) {
                      if (!active) {
                          return;
                      }
                      invalidate();
                      Choreographer.getInstance().postFrameCallback(this);
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int mode = ClockPrefs.getThemeMode(getContext());
                      if (!ClockPrefs.hasCustomBackground(getContext())) {
                          if (mode == ClockPrefs.MODE_TRANS_LIGHT_TEXT) {
                              canvas.drawColor(Color.parseColor("#1E293B"));
                          } else if (mode == ClockPrefs.MODE_TRANS_DARK_TEXT) {
                              canvas.drawColor(Color.parseColor("#E2E8F0"));
                          }
                      }
                      renderer.drawClock(
                              getContext(),
                              canvas,
                              getWidth(),
                              getHeight(),
                              System.currentTimeMillis(),
                              mode,
                              ClockPrefs.isUse24Hour(getContext()),
                              ClockPrefs.POS_CENTER,
                              false,
                              0f,
                              0f
                      );
                  }
              }
          }
