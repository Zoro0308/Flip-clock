              /**
               * Renders a single card's Top Half and Bottom Half as two separate Bitmaps
               * for the 60fps Hardware-Accelerated ViewFlipper Home Screen Widget.
               */
              public synchronized Bitmap[] renderCardHalvesForWidget(
                      int cardW,
                      int cardH,
                      String text,
                      String badgeText,
                      int themeMode
              ) {
                  int evenH = (cardH / 2) * 2;
                  int halfH = evenH / 2;
                  Bitmap full = Bitmap.createBitmap(cardW, evenH, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(full);
          
                  int[] palette = getPalette(themeMode);
                  draw3DSplitFlapCard(
                          canvas,
                          2f, 2f, cardW - 4f, evenH - 4f,
                          text, text, 0.0f,
                          badgeText,
                          palette[0], palette[1], palette[2], palette[3], palette[4], palette[5]
                  );
          
                  Bitmap topHalf = Bitmap.createBitmap(full, 0, 0, cardW, halfH);
                  Bitmap botHalf = Bitmap.createBitmap(full, 0, halfH, cardW, halfH);
                  full.recycle();
                  return new Bitmap[]{topHalf, botHalf};
              }
          
              private int[] getPalette(int themeMode) {
                  int cardTopColor;
                  int cardBottomColor;
                  int flapFaceColor;
                  int borderColor;
                  int digitColor;
                  int splitLineColor;
          
                  switch (themeMode) {
                      case ClockPrefs.MODE_WHITE_LIGHT:
                          cardTopColor = Color.parseColor("#FFFFFF");
                          cardBottomColor = Color.parseColor("#E6E6EC");
                          flapFaceColor = Color.parseColor("#F8F8FC");
