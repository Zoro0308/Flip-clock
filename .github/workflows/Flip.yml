      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Signed APK
        working-directory: flip_clock_build
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RealmeFlipOdometerClock.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: RealmeFlipOdometerClock-APK
          path: RealmeFlipOdometerClock.apk
          if-no-files-found: error
