          package com.realme.flipclock;
          
          import android.app.ForegroundServiceStartNotAllowedException;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.appwidget.AppWidgetManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.util.Log;
          
          public class FlipWidgetService extends Service {
          
              private static final String TAG = "FlipWidgetService";
              private static final String CHANNEL_ID = "flip_widget_60fps_channel";
              private static final int NOTIF_ID = 102;
          
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean dynamicReceiversRegistered = false;
              private boolean isForegroundActive = false;
          
              private final Runnable tickRunnable = new Runnable() {
                  @Override
                  public void run() {
                      handler.removeCallbacks(this);
          
                      if (!hasActiveWidgets(FlipWidgetService.this)) {
                          Log.i(TAG, "No active home-screen widgets remaining; stopping service and removing notification.");
                          shutdownServiceCleanly();
                          return;
                      }
          
                      if (!isScreenInteractive()) {
                          return;
                      }
          
                      long now = System.currentTimeMillis();
                      boolean animateSeconds = ClockPrefs.shouldAnimateSeconds(FlipWidgetService.this);
                      FlipOdometerWidgetProvider.tickWidgetOnSecondBoundary(FlipWidgetService.this, now, false);
          
                      long msIntoSecond = System.currentTimeMillis() % 1000L;
                      if (animateSeconds) {
                          long delayToNextSecond = Math.max(100L, 1005L - msIntoSecond);
                          handler.postDelayed(this, delayToNextSecond);
                      } else {
                          // Battery-saving mode or seconds hidden: only wake at minute rollovers
                          int sec = (int) ((System.currentTimeMillis() / 1000L) % 60L);
                          long delayToNextMinute = Math.max(500L, (60L - sec) * 1000L - msIntoSecond + 10L);
                          handler.postDelayed(this, delayToNextMinute);
                      }
                  }
              };
          
              private final BroadcastReceiver dynamicReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (intent == null || intent.getAction() == null) {
                          return;
                      }
                      String action = intent.getAction();
                      if (!hasActiveWidgets(context)) {
                          shutdownServiceCleanly();
                          return;
                      }
                      if (Intent.ACTION_SCREEN_OFF.equals(action)) {
                          handler.removeCallbacks(tickRunnable);
                      } else if (Intent.ACTION_SCREEN_ON.equals(action)
                              || Intent.ACTION_TIME_CHANGED.equals(action)
                              || Intent.ACTION_TIMEZONE_CHANGED.equals(action)
                              || Intent.ACTION_TIME_TICK.equals(action)) {
                          handler.removeCallbacks(tickRunnable);
                          FlipOdometerWidgetProvider.tickWidgetOnSecondBoundary(
                                  FlipWidgetService.this,
                                  System.currentTimeMillis(),
                                  true
                          );
                          if (isScreenInteractive()) {
                              handler.postDelayed(tickRunnable, 1005L - (System.currentTimeMillis() % 1000L));
                          }
                      }
                  }
              };
          
              @Override
              public void onCreate() {
                  super.onCreate();
                  if (!hasActiveWidgets(this)) {
                      stopSelf();
                      return;
                  }
                  startForegroundSafely();
                  registerDynamicReceivers();
              }
          
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!hasActiveWidgets(this)) {
                      Log.i(TAG, "onStartCommand: zero active widgets, stopping immediately.");
                      shutdownServiceCleanly();
                      return START_NOT_STICKY;
                  }
                  startForegroundSafely();
                  registerDynamicReceivers();
                  handler.removeCallbacks(tickRunnable);
                  if (isScreenInteractive()) {
                      FlipOdometerWidgetProvider.tickWidgetOnSecondBoundary(this, System.currentTimeMillis(), true);
                      handler.post(tickRunnable);
                  }
                  return START_STICKY;
              }
          
              @Override
              public void onDestroy() {
                  cleanupResources();
                  super.onDestroy();
              }
          
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          
              private void shutdownServiceCleanly() {
                  cleanupResources();
                  try {
                      stopForeground(Service.STOP_FOREGROUND_REMOVE);
                      isForegroundActive = false;
                  } catch (Exception e) {
                      Log.w(TAG, "Error removing foreground notification during shutdown", e);
                  }
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.cancel(NOTIF_ID);
                      }
                  } catch (Exception e) {
                      Log.w(TAG, "Error cancelling notification", e);
                  }
                  stopSelf();
              }
          
              private void cleanupResources() {
                  handler.removeCallbacksAndMessages(null);
                  if (dynamicReceiversRegistered) {
                      try {
                          unregisterReceiver(dynamicReceiver);
                      } catch (Exception e) {
                          Log.w(TAG, "Error unregistering dynamic receiver", e);
                      }
                      dynamicReceiversRegistered = false;
                  }
              }
          
              private void startForegroundSafely() {
                  if (isForegroundActive) {
                      return;
                  }
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID,
                                  "60fps Flip Clock Widget",
                                  NotificationManager.IMPORTANCE_MIN
                          );
                          channel.setShowBadge(false);
                          nm.createNotificationChannel(channel);
                      }
                      String modeDesc = ClockPrefs.shouldAnimateSeconds(this)
                              ? "60fps hardware-accelerated flip animation"
                              : "Battery-saver minute sync active";
                      Notification notif = new Notification.Builder(this, CHANNEL_ID)
                              .setContentTitle("3D Flip Clock Widget Active")
                              .setContentText(modeDesc)
                              .setSmallIcon(R.drawable.ic_launcher)
                              .setOngoing(true)
                              .build();
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                      isForegroundActive = true;
                  } catch (ForegroundServiceStartNotAllowedException fgsEx) {
                      Log.w(TAG, "Foreground service start restricted by OS background policy; falling back to minute alarm.", fgsEx);
                      FlipOdometerWidgetProvider.scheduleMinuteAlarm(this);
                      stopSelf();
                  } catch (Exception e) {
                      Log.e(TAG, "Unexpected error starting foreground widget service", e);
                      FlipOdometerWidgetProvider.scheduleMinuteAlarm(this);
                  }
              }
          
              private void registerDynamicReceivers() {
                  if (!dynamicReceiversRegistered) {
                      try {
                          IntentFilter filter = new IntentFilter();
                          filter.addAction(Intent.ACTION_SCREEN_ON);
                          filter.addAction(Intent.ACTION_SCREEN_OFF);
                          filter.addAction(Intent.ACTION_TIME_TICK);
                          filter.addAction(Intent.ACTION_TIME_CHANGED);
                          filter.addAction(Intent.ACTION_TIMEZONE_CHANGED);
                          registerReceiver(dynamicReceiver, filter);
                          dynamicReceiversRegistered = true;
                      } catch (Exception e) {
                          Log.e(TAG, "Failed to register screen/time broadcast receiver", e);
                      }
                  }
              }
          
              private boolean isScreenInteractive() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      return pm == null || pm.isInteractive();
                  } catch (Exception e) {
                      Log.w(TAG, "Error querying PowerManager.isInteractive", e);
                      return true;
                  }
              }
          
              public static boolean hasActiveWidgets(Context context) {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      if (mgr == null) return false;
                      int[] ids = mgr.getAppWidgetIds(new ComponentName(context, FlipOdometerWidgetProvider.class));
                      return ids != null && ids.length > 0;
                  } catch (Exception e) {
                      Log.e(TAG, "Error checking active widget IDs", e);
                      return false;
                  }
              }
          
              public static void ensureRunning(Context context) {
                  if (context == null) return;
                  if (!hasActiveWidgets(context)) {
                      stopServiceIfRunning(context);
                      return;
                  }
                  try {
                      Intent s = new Intent(context, FlipWidgetService.class);
                      context.startForegroundService(s);
                  } catch (ForegroundServiceStartNotAllowedException fgsEx) {
                      // Do NOT retry with startService() (which throws IllegalStateException on API 31+);
                      // schedule a clean non-waking minute alarm instead.
                      Log.w(TAG, "OS blocked background startForegroundService; scheduling minute alarm fallback.", fgsEx);
                      FlipOdometerWidgetProvider.scheduleMinuteAlarm(context);
                  } catch (IllegalStateException ise) {
                      Log.w(TAG, "Cannot start service from current background state; scheduling minute alarm.", ise);
                      FlipOdometerWidgetProvider.scheduleMinuteAlarm(context);
                  } catch (Exception e) {
                      Log.e(TAG, "Failed to start FlipWidgetService", e);
                  }
              }
          
              public static void stopServiceIfRunning(Context context) {
                  if (context == null) return;
                  try {
                      FlipOdometerWidgetProvider.cancelMinuteAlarm(context);
                      Intent s = new Intent(context, FlipWidgetService.class);
                      context.stopService(s);
                  } catch (Exception e) {
                      Log.w(TAG, "Error stopping FlipWidgetService", e);
                  }
              }
          }
