                          ClockPrefs.setThemeMode(MainActivity.this, mode);
                          FlipOdometerWidgetProvider.updateAllWidgets(MainActivity.this);
                          refreshStatus();
                      }
                  });
                  return b;
              }
          
              private Button makePosBtn(final String label, final int pos) {
                  Button b = makeButton(label, "#1E293B", "#F8FAFC");
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          ClockPrefs.setVerticalPos(MainActivity.this, pos);
                          refreshStatus();
                          Toast.makeText(MainActivity.this, "Wallpaper Clock Position: " + label, Toast.LENGTH_SHORT).show();
                      }
                  });
                  return b;
