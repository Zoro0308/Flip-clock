name: Build Realme 3D Flip Clock APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Flip Clock Project Files
        run: |
          mkdir -p flip_clock_build
          cd flip_clock_build
          cat << 'EOF_FILE' > "settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RealmeFlipOdometerClock"
          include ':app'
          EOF_FILE

          cat << 'EOF_FILE' > "build.gradle"
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE

          cat << 'EOF_FILE' > "gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF_FILE

          mkdir -p "app"
          cat << 'EOF_FILE' > "app/build.gradle"
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.realme.flipclock'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.realme.flipclock"
                  minSdk 31
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
          
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
          }
          EOF_FILE

          mkdir -p "app/src/main"
          cat << 'EOF_FILE' > "app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
          
              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="false" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".FullScreenClockActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar.Fullscreen"
                      android:label="@string/app_name" />
          
                  <service
                      android:name=".FlipOdometerWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/wallpaper_label"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper_info" />
                  </service>
          
                  <service
                      android:name=".FlipWidgetService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Live 3D split-flap home screen clock widget second ticker" />
                  </service>
          
                  <receiver
                      android:name=".FlipOdometerWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_label">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_CYCLE_THEME" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_OPEN_APP" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/flip_widget_info" />
                  </receiver>
          
              </application>
          </manifest>
          EOF_FILE

          mkdir -p "app/src/main/res/values"
          cat << 'EOF_FILE' > "app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">3D Flip Clock</string>
              <string name="wallpaper_label">3D Split-Flap Live Wallpaper</string>
              <string name="wallpaper_description">Real 3D split-flap flip clock (Hours, Minutes, Seconds) with custom Gallery background, Dark AMOLED, White, and Transparent modes.</string>
              <string name="widget_label">3D Flip Clock Widget (Live Ticking)</string>
          </resources>
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/wallpaper_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description"
              android:settingsActivity="com.realme.flipclock.MainActivity"
              android:thumbnail="@drawable/ic_launcher" />
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/flip_widget_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:minResizeWidth="180dp"
              android:minResizeHeight="80dp"
              android:maxResizeWidth="900dp"
              android:maxResizeHeight="500dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_flip"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/wallpaper_description" />
          EOF_FILE

          mkdir -p "app/src/main/res/layout"
          cat << 'EOF_FILE' > "app/src/main/res/layout/widget_flip.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="2dp">
          
              <ImageView
                  android:id="@+id/widget_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"
                  android:contentDescription="@string/app_name" />
          
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="horizontal"
                  android:weightSum="3">
          
                  <FrameLayout
                      android:id="@+id/widget_left_tap"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="2" />
          
                  <FrameLayout
                      android:id="@+id/widget_right_tap"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1" />
              </LinearLayout>
          </FrameLayout>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M18,0 L90,0 A18,18 0 0,1 108,18 L108,90 A18,18 0 0,1 90,108 L18,108 A18,18 0 0,1 0,90 L0,18 A18,18 0 0,1 18,0 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M14,26 L50,26 A6,6 0 0,1 56,32 L56,76 A6,6 0 0,1 50,82 L14,82 A6,6 0 0,1 8,76 L8,32 A6,6 0 0,1 14,26 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M64,26 L94,26 A6,6 0 0,1 100,32 L100,76 A6,6 0 0,1 94,82 L64,82 A6,6 0 0,1 58,76 L58,32 A6,6 0 0,1 64,26 Z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M24,40 L24,68 M40,40 L40,68 M72,40 L86,40 L86,54 L72,54 L72,68 L86,68" />
              <path
                  android:strokeColor="#000000"
                  android:strokeWidth="2.5"
                  android:pathData="M8,54 L100,54" />
          </vector>
          EOF_FILE

          mkdir -p "app/src/main/java/com/realme/flipclock"
          cat << 'EOF_FILE' > "app/src/main/java/com/realme/flipclock/ClockPrefs.java"
          package com.realme.flipclock;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          
          public class ClockPrefs {
          
              public static final String PREFS_NAME = "FlipClockV2Prefs";
              public static final String KEY_THEME_MODE = "theme_mode";
              public static final String KEY_USE_24H = "use_24h";
              public static final String KEY_VERTICAL_POS = "vertical_pos";
              public static final String KEY_HAS_CUSTOM_BG = "has_custom_bg";
              public static final String KEY_CUSTOM_BG_STAMP = "custom_bg_stamp";
              public static final String CUSTOM_BG_FILENAME = "custom_wallpaper_bg.jpg";
          
              public static final int MODE_AMOLED_DARK = 0;
              public static final int MODE_WHITE_LIGHT = 1;
              public static final int MODE_TRANS_LIGHT_TEXT = 2;
              public static final int MODE_TRANS_DARK_TEXT = 3;
          
              public static final int POS_TOP_WIDGET = 0;
              public static final int POS_CENTER = 1;
              public static final int POS_BOTTOM = 2;
          
              public static int getThemeMode(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getInt(KEY_THEME_MODE, MODE_AMOLED_DARK);
              }
          
              public static void setThemeMode(Context context, int mode) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putInt(KEY_THEME_MODE, (mode % 4 + 4) % 4)
                          .apply();
              }
          
              public static int cycleThemeMode(Context context) {
                  int next = (getThemeMode(context) + 1) % 4;
                  setThemeMode(context, next);
                  return next;
              }
          
              public static boolean isUse24Hour(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getBoolean(KEY_USE_24H, false);
              }
          
              public static void setUse24Hour(Context context, boolean use24h) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putBoolean(KEY_USE_24H, use24h)
                          .apply();
              }
          
              public static int getVerticalPos(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getInt(KEY_VERTICAL_POS, POS_TOP_WIDGET);
              }
          
              public static void setVerticalPos(Context context, int pos) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putInt(KEY_VERTICAL_POS, pos)
                          .apply();
              }
          
              public static boolean hasCustomBackground(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  File f = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                  return p.getBoolean(KEY_HAS_CUSTOM_BG, false) && f.exists();
              }
          
              public static long getCustomBgStamp(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getLong(KEY_CUSTOM_BG_STAMP, 0L);
              }
          
              public static void clearCustomBackground(Context context) {
                  File f = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                  if (f.exists()) {
                      f.delete();
                  }
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putBoolean(KEY_HAS_CUSTOM_BG, false)
                          .putLong(KEY_CUSTOM_BG_STAMP, System.currentTimeMillis())
                          .apply();
              }
          
              public static boolean saveCustomBackgroundFromUri(Context context, Uri uri) {
                  if (uri == null) {
                      return false;
                  }
                  InputStream in1 = null;
                  InputStream in2 = null;
                  FileOutputStream fos = null;
                  try {
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      in1 = context.getContentResolver().openInputStream(uri);
                      BitmapFactory.decodeStream(in1, null, bounds);
                      if (in1 != null) {
                          in1.close();
                          in1 = null;
                      }
          
                      int maxDim = Math.max(bounds.outWidth, bounds.outHeight);
                      int sampleSize = 1;
                      while (maxDim / sampleSize > 2048) {
                          sampleSize *= 2;
                      }
          
                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      opts.inSampleSize = sampleSize;
                      in2 = context.getContentResolver().openInputStream(uri);
                      Bitmap decoded = BitmapFactory.decodeStream(in2, null, opts);
                      if (decoded == null) {
                          return false;
                      }
          
                      File outFile = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                      fos = new FileOutputStream(outFile);
                      decoded.compress(Bitmap.CompressFormat.JPEG, 90, fos);
                      fos.flush();
                      decoded.recycle();
          
                      context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                              .edit()
                              .putBoolean(KEY_HAS_CUSTOM_BG, true)
                              .putLong(KEY_CUSTOM_BG_STAMP, System.currentTimeMillis())
                              .apply();
                      return true;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      try {
                          if (in1 != null) in1.close();
                      } catch (Exception ignored) {
                      }
                      try {
                          if (in2 != null) in2.close();
                      } catch (Exception ignored) {
                      }
                      try {
                          if (fos != null) fos.close();
                      } catch (Exception ignored) {
                      }
                  }
              }
          
              public static Bitmap loadCustomBackgroundBitmap(Context context) {
                  try {
                      File f = new File(context.getFilesDir(), CUSTOM_BG_FILENAME);
                      if (!f.exists()) {
                          return null;
                      }
                      return BitmapFactory.decodeFile(f.getAbsolutePath());
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          EOF_FILE

          mkdir -p "app/src/main/java/com/realme/flipclock"
          cat << 'EOF_FILE' > "app/src/main/java/com/realme/flipclock/FlipOdometerRenderer.java"
          package com.realme.flipclock;
          
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PorterDuff;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import java.util.Calendar;
          import java.util.Locale;
          
          public class FlipOdometerRenderer {
          
              private static final float FLIP_DURATION_MS = 440.0f;
          
              private final Paint cardPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint borderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint splitLinePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint digitPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
              private final Paint badgePaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
              private final Paint shadowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint bgBitmapPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
          
              private final RectF cardRect = new RectF();
              private final Path cardClipPath = new Path();
              private final Path flapPath = new Path();
              private final Rect srcRect = new Rect();
              private final Rect dstRect = new Rect();
          
              private final Typeface condensedBold;
              private final Typeface sansBold;
          
              private Bitmap cachedBgBitmap = null;
              private long cachedBgStamp = -1L;
          
              public FlipOdometerRenderer() {
                  condensedBold = Typeface.create("sans-serif-condensed", Typeface.BOLD);
                  sansBold = Typeface.create("sans-serif", Typeface.BOLD);
                  digitPaint.setTypeface(condensedBold);
                  digitPaint.setTextAlign(Paint.Align.CENTER);
                  badgePaint.setTypeface(sansBold);
                  badgePaint.setTextAlign(Paint.Align.LEFT);
                  borderPaint.setStyle(Paint.Style.STROKE);
              }
          
              public void drawClock(
                      Context context,
                      Canvas canvas,
                      int width,
                      int height,
                      long nowMillis,
                      int themeMode,
                      boolean use24Hour,
                      int verticalPos,
                      boolean isWidget,
                      float pixelShiftX,
                      float pixelShiftY
              ) {
                  if (width <= 0 || height <= 0) {
                      return;
                  }
          
                  // 1. Background rendering (AMOLED Dark, White, Transparent, or Custom Gallery Photo)
                  if (isWidget) {
                      // For the Home Screen Widget, clear background so rounded cards or transparent cards sit cleanly over launcher
                      canvas.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR);
                      if (themeMode == ClockPrefs.MODE_AMOLED_DARK) {
                          Paint widgetBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                          widgetBg.setColor(Color.BLACK);
                          canvas.drawRoundRect(new RectF(0, 0, width, height), 42f, 42f, widgetBg);
                      } else if (themeMode == ClockPrefs.MODE_WHITE_LIGHT) {
                          Paint widgetBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                          widgetBg.setColor(Color.parseColor("#F2F2F7"));
                          canvas.drawRoundRect(new RectF(0, 0, width, height), 42f, 42f, widgetBg);
                      }
                  } else {
                      boolean drewCustomPhoto = false;
                      if (context != null && ClockPrefs.hasCustomBackground(context)) {
                          long currentStamp = ClockPrefs.getCustomBgStamp(context);
                          if (cachedBgBitmap == null || cachedBgStamp != currentStamp) {
                              cachedBgBitmap = ClockPrefs.loadCustomBackgroundBitmap(context);
                              cachedBgStamp = currentStamp;
                          }
                          if (cachedBgBitmap != null && !cachedBgBitmap.isRecycled()) {
                              drawCenterCropBitmap(canvas, cachedBgBitmap, width, height);
                              drewCustomPhoto = true;
                          }
                      }
                      if (!drewCustomPhoto) {
                          if (themeMode == ClockPrefs.MODE_AMOLED_DARK) {
                              canvas.drawColor(Color.BLACK);
                          } else if (themeMode == ClockPrefs.MODE_WHITE_LIGHT) {
                              canvas.drawColor(Color.parseColor("#F2F2F7"));
                          } else {
                              canvas.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR);
                          }
                      }
                  }
          
                  // 2. Card color palette for each mode
                  int cardTopColor;
                  int cardBottomColor;
                  int flapFaceColor;
                  int borderColor;
                  int digitColor;
                  int splitLineColor;
          
                  switch (themeMode) {
                      case ClockPrefs.MODE_WHITE_LIGHT:
                          cardTopColor = Color.parseColor("#FFFFFF");
                          cardBottomColor = Color.parseColor("#E6E6EC");
                          flapFaceColor = Color.parseColor("#F8F8FC");
                          borderColor = Color.parseColor("#D1D1D6");
                          digitColor = Color.parseColor("#18181B");
                          splitLineColor = Color.parseColor("#C7C7CC");
                          break;
                      case ClockPrefs.MODE_TRANS_LIGHT_TEXT:
                          cardTopColor = Color.argb(135, 28, 28, 34);
                          cardBottomColor = Color.argb(165, 16, 16, 20);
                          flapFaceColor = Color.argb(215, 34, 34, 42);
                          borderColor = Color.argb(130, 255, 255, 255);
                          digitColor = Color.parseColor("#F8FAFC");
                          splitLineColor = Color.argb(180, 0, 0, 0);
                          break;
                      case ClockPrefs.MODE_TRANS_DARK_TEXT:
                          cardTopColor = Color.argb(150, 255, 255, 255);
                          cardBottomColor = Color.argb(175, 232, 232, 240);
                          flapFaceColor = Color.argb(225, 248, 248, 252);
                          borderColor = Color.argb(140, 24, 24, 27);
                          digitColor = Color.parseColor("#141417");
                          splitLineColor = Color.argb(150, 150, 150, 160);
                          break;
                      case ClockPrefs.MODE_AMOLED_DARK:
                      default:
                          cardTopColor = Color.parseColor("#222226");
                          cardBottomColor = Color.parseColor("#141417");
                          flapFaceColor = Color.parseColor("#28282D");
                          borderColor = Color.parseColor("#2E2E34");
                          digitColor = Color.parseColor("#E2E2E8");
                          splitLineColor = Color.parseColor("#000000");
                          break;
                  }
          
                  // 3. Calculate current and previous second/minute/hour for true 3D split-flap transitions
                  Calendar currCal = Calendar.getInstance();
                  currCal.setTimeInMillis(nowMillis);
          
                  Calendar prevCal = Calendar.getInstance();
                  prevCal.setTimeInMillis(nowMillis - 1000L);
          
                  int ms = currCal.get(Calendar.MILLISECOND);
                  float rawFlipProgress = Math.min(1.0f, Math.max(0.0f, ms / FLIP_DURATION_MS));
                  // Smooth ease-in-out curve for realistic gravity-assisted flap drop
                  float flipProgress = easeInOutFlip(rawFlipProgress);
          
                  int currSec = currCal.get(Calendar.SECOND);
                  int prevSec = prevCal.get(Calendar.SECOND);
          
                  int currMin = currCal.get(Calendar.MINUTE);
                  int prevMin = prevCal.get(Calendar.MINUTE);
          
                  int currHour24 = currCal.get(Calendar.HOUR_OF_DAY);
                  int prevHour24 = prevCal.get(Calendar.HOUR_OF_DAY);
          
                  boolean isPm = (currHour24 >= 12);
                  int currHourDisp = use24Hour ? currHour24 : (currHour24 % 12 == 0 ? 12 : currHour24 % 12);
                  int prevHourDisp = use24Hour ? prevHour24 : (prevHour24 % 12 == 0 ? 12 : prevHour24 % 12);
          
                  String currHourStr = use24Hour
                          ? String.format(Locale.US, "%02d", currHourDisp)
                          : String.valueOf(currHourDisp);
                  String prevHourStr = use24Hour
                          ? String.format(Locale.US, "%02d", prevHourDisp)
                          : String.valueOf(prevHourDisp);
          
                  String currMinStr = String.format(Locale.US, "%02d", currMin);
                  String prevMinStr = String.format(Locale.US, "%02d", prevMin);
          
                  String currSecStr = String.format(Locale.US, "%02d", currSec);
                  String prevSecStr = String.format(Locale.US, "%02d", prevSec);
          
                  // Each card ONLY flips when its value changes!
                  float secFlipP = (currSec != prevSec) ? flipProgress : 0.0f;
                  float minFlipP = (currMin != prevMin) ? flipProgress : 0.0f;
                  float hourFlipP = (currHourDisp != prevHourDisp) ? flipProgress : 0.0f;
          
                  // 4. Layout geometry matching 1000386934.jpg (Hours Card + Minutes Card + Small Seconds Card at bottom-right)
                  float availW = width * (isWidget ? 0.94f : 0.90f);
                  float availH = height * (isWidget ? 0.88f : 0.80f);
                  float unitByW = availW / 2.64f;
                  float unitByH = availH / 1.05f;
                  float bigCardW = Math.min(unitByW, unitByH);
                  float bigCardH = bigCardW * 1.04f;
                  float gap = bigCardW * 0.055f;
                  float secCardW = bigCardW * 0.53f;
                  float secCardH = bigCardH * 0.49f;
          
                  float totalW = bigCardW * 2.0f + secCardW + gap * 2.0f;
                  float startX = (width - totalW) * 0.5f + pixelShiftX;
          
                  float centerY;
                  if (!isWidget && verticalPos == ClockPrefs.POS_TOP_WIDGET) {
                      centerY = Math.max(bigCardH * 0.72f, height * 0.28f) + pixelShiftY;
                  } else if (!isWidget && verticalPos == ClockPrefs.POS_BOTTOM) {
                      centerY = Math.min(height - bigCardH * 0.72f, height * 0.72f) + pixelShiftY;
                  } else {
                      centerY = height * 0.50f + pixelShiftY;
                  }
                  float topY = centerY - bigCardH * 0.5f;
          
                  String amPmBadge = use24Hour ? null : (isPm ? "PM" : "AM");
          
                  // Card 1: Hours (Large Left)
                  draw3DSplitFlapCard(
                          canvas,
                          startX, topY, bigCardW, bigCardH,
                          prevHourStr, currHourStr, hourFlipP,
                          amPmBadge,
                          cardTopColor, cardBottomColor, flapFaceColor, borderColor, digitColor, splitLineColor
                  );
          
                  // Card 2: Minutes (Large Middle)
                  float minX = startX + bigCardW + gap;
                  draw3DSplitFlapCard(
                          canvas,
                          minX, topY, bigCardW, bigCardH,
                          prevMinStr, currMinStr, minFlipP,
                          null,
                          cardTopColor, cardBottomColor, flapFaceColor, borderColor, digitColor, splitLineColor
                  );
          
                  // Card 3: Seconds (Small Bottom-Right, matching 1000386934.jpg)
                  float secX = minX + bigCardW + gap;
                  float secY = topY + bigCardH - secCardH;
                  draw3DSplitFlapCard(
                          canvas,
                          secX, secY, secCardW, secCardH,
                          prevSecStr, currSecStr, secFlipP,
                          null,
                          cardTopColor, cardBottomColor, flapFaceColor, borderColor, digitColor, splitLineColor
                  );
              }
          
              private void draw3DSplitFlapCard(
                      Canvas canvas,
                      float x, float y, float w, float h,
                      String oldText, String newText, float flipP,
                      String badgeText,
                      int cardTopColor, int cardBottomColor, int flapFaceColor,
                      int borderColor, int digitColor, int splitLineColor
              ) {
                  float radius = Math.min(w, h) * 0.085f;
                  float cx = x + w * 0.5f;
                  float cy = y + h * 0.5f;
                  cardRect.set(x, y, x + w, y + h);
          
                  // 1. Draw static upper half and lower half backgrounds
                  LinearGradient baseGrad = new LinearGradient(
                          x, y, x, y + h,
                          cardTopColor, cardBottomColor,
                          Shader.TileMode.CLAMP
                  );
                  cardPaint.setShader(baseGrad);
                  canvas.drawRoundRect(cardRect, radius, radius, cardPaint);
                  cardPaint.setShader(null);
          
                  digitPaint.setTextSize(h * 0.72f);
                  Paint.FontMetrics fm = digitPaint.getFontMetrics();
                  float textBaseline = cy - (fm.ascent + fm.descent) * 0.5f;
          
                  if (flipP <= 0.001f || flipP >= 0.999f) {
                      // Static card (not currently mid-flip)
                      canvas.save();
                      cardClipPath.reset();
                      cardClipPath.addRoundRect(cardRect, radius, radius, Path.Direction.CW);
                      canvas.clipPath(cardClipPath);
                      digitPaint.setColor(digitColor);
                      digitPaint.setAlpha(255);
                      canvas.drawText(newText, cx, textBaseline, digitPaint);
                      canvas.restore();
                  } else {
                      // ACTIVE 3D SPLIT-FLAP TRANSITION (matches 1000386934.jpg)
                      // Layer A: Static Upper Half shows TOP of NEW number
                      canvas.save();
                      cardClipPath.reset();
                      cardClipPath.addRoundRect(cardRect, radius, radius, Path.Direction.CW);
                      canvas.clipPath(cardClipPath);
                      canvas.clipRect(x, y, x + w, cy);
                      digitPaint.setColor(digitColor);
                      digitPaint.setAlpha((int) (160 + 95 * flipP));
                      canvas.drawText(newText, cx, textBaseline, digitPaint);
                      canvas.restore();
          
                      // Layer B: Static Lower Half shows BOTTOM of OLD number
                      canvas.save();
                      cardClipPath.reset();
                      cardClipPath.addRoundRect(cardRect, radius, radius, Path.Direction.CW);
                      canvas.clipPath(cardClipPath);
                      canvas.clipRect(x, cy, x + w, y + h);
                      digitPaint.setColor(digitColor);
                      digitPaint.setAlpha(230);
                      canvas.drawText(oldText, cx, textBaseline, digitPaint);
          
                      // If flap is in lower half (flipP >= 0.5), cast dark drop-shadow onto the old lower half
                      if (flipP >= 0.5f) {
                          float theta = (float) (flipP * Math.PI);
                          float sinT = (float) Math.sin(theta);
                          float cosT = (float) Math.abs(Math.cos(theta));
                          float flapH = (h * 0.5f) * Math.max(0.15f, cosT);
                          float shadowBottom = Math.min(y + h, cy + flapH + h * 0.12f * sinT);
                          shadowPaint.setColor(Color.argb((int) (165 * sinT), 0, 0, 0));
                          canvas.drawRect(x, cy, x + w, shadowBottom, shadowPaint);
                      }
                      canvas.restore();
          
                      // Layer C: 3D Hinged Falling Flap (Trapezoid with perspective flare + foreshortened text)
                      float theta = (float) (flipP * Math.PI); // 0 to PI
                      float sinT = (float) Math.sin(theta);
                      float scaleY = Math.max(0.16f, (float) Math.abs(Math.cos(theta)));
                      float flapH = (h * 0.5f) * scaleY;
                      float flareX = sinT * (w * 0.065f);
          
                      canvas.save();
                      flapPath.reset();
                      if (flipP < 0.5f) {
                          // Phase 1 (0.0 -> 0.5): Upper flap falling forward above cy
                          float fyTop = cy - flapH;
                          flapPath.moveTo(x, cy);
                          flapPath.lineTo(x + w, cy);
                          flapPath.lineTo(x + w + flareX, fyTop);
                          flapPath.lineTo(x - flareX, fyTop);
                          flapPath.close();
          
                          cardPaint.setColor(flapFaceColor);
                          canvas.drawPath(flapPath, cardPaint);
          
                          canvas.clipPath(flapPath);
                          canvas.scale(1.0f, scaleY, cx, cy);
                          digitPaint.setColor(digitColor);
                          digitPaint.setAlpha(255);
                          canvas.drawText(oldText, cx, textBaseline, digitPaint);
                      } else {
                          // Phase 2 (0.5 -> 1.0): Lower flap swinging down below cy (like '28' & '59' in 1000386934.jpg)
                          float fyBot = cy + flapH;
                          flapPath.moveTo(x, cy);
                          flapPath.lineTo(x + w, cy);
                          flapPath.lineTo(x + w + flareX, fyBot);
                          flapPath.lineTo(x - flareX, fyBot);
                          flapPath.close();
          
                          cardPaint.setColor(flapFaceColor);
                          canvas.drawPath(flapPath, cardPaint);
          
                          canvas.clipPath(flapPath);
                          canvas.scale(1.0f, scaleY, cx, cy);
                          digitPaint.setColor(digitColor);
                          digitPaint.setAlpha(255);
                          canvas.drawText(newText, cx, textBaseline, digitPaint);
                      }
                      canvas.restore();
          
                      // Draw subtle 3D border around the falling trapezoid flap
                      borderPaint.setColor(borderColor);
                      borderPaint.setStrokeWidth(Math.max(1.5f, h * 0.006f));
                      canvas.drawPath(flapPath, borderPaint);
                  }
          
                  // 2. Center horizontal split-flap hinge line
                  splitLinePaint.setColor(splitLineColor);
                  splitLinePaint.setStrokeWidth(Math.max(2.2f, h * 0.013f));
                  canvas.drawLine(x, cy, x + w, cy, splitLinePaint);
          
                  // 3. Optional AM/PM badge in bottom-left of Hours card
                  if (badgeText != null) {
                      badgePaint.setColor(digitColor);
                      badgePaint.setAlpha(215);
                      badgePaint.setTextSize(h * 0.095f);
                      canvas.drawText(badgeText, x + w * 0.065f, y + h * 0.92f, badgePaint);
                  }
          
                  // 4. Outer card border
                  borderPaint.setColor(borderColor);
                  borderPaint.setStrokeWidth(Math.max(1.5f, h * 0.006f));
                  canvas.drawRoundRect(cardRect, radius, radius, borderPaint);
              }
          
              private void drawCenterCropBitmap(Canvas canvas, Bitmap bmp, int viewW, int viewH) {
                  int bw = bmp.getWidth();
                  int bh = bmp.getHeight();
                  if (bw <= 0 || bh <= 0) {
                      return;
                  }
                  float scale = Math.max((float) viewW / bw, (float) viewH / bh);
                  int cropW = Math.round(viewW / scale);
                  int cropH = Math.round(viewH / scale);
                  int cropX = Math.max(0, (bw - cropW) / 2);
                  int cropY = Math.max(0, (bh - cropH) / 2);
                  srcRect.set(cropX, cropY, cropX + cropW, cropY + cropH);
                  dstRect.set(0, 0, viewW, viewH);
                  canvas.drawBitmap(bmp, srcRect, dstRect, bgBitmapPaint);
              }
          
              private float easeInOutFlip(float t) {
                  if (t <= 0.0f) return 0.0f;
                  if (t >= 1.0f) return 1.0f;
                  return t * t * (3.0f - 2.0f * t);
              }
          }
