name: Build Realme Flip Odometer Clock APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Flip Clock Project Files
        run: |
          mkdir -p flip_clock_build
          cd flip_clock_build
          cat << 'EOF_FILE' > "settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RealmeFlipOdometerClock"
          include ':app'
          EOF_FILE

          cat << 'EOF_FILE' > "build.gradle"
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE

          cat << 'EOF_FILE' > "gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF_FILE

          mkdir -p "app"
          cat << 'EOF_FILE' > "app/build.gradle"
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.realme.flipclock'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.realme.flipclock"
                  minSdk 31
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
          }
          EOF_FILE

          mkdir -p "app/src/main"
          cat << 'EOF_FILE' > "app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="false" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".FullScreenClockActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar.Fullscreen"
                      android:label="@string/app_name" />
          
                  <service
                      android:name=".FlipOdometerWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/wallpaper_label"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper_info" />
                  </service>
          
                  <receiver
                      android:name=".FlipOdometerWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_label">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="com.realme.flipclock.ACTION_WIDGET_TAP" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/flip_widget_info" />
                  </receiver>
          
              </application>
          </manifest>
          EOF_FILE

          mkdir -p "app/src/main/res/values"
          cat << 'EOF_FILE' > "app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Flip Odometer Clock</string>
              <string name="wallpaper_label">AMOLED Rolling Flip Clock</string>
              <string name="wallpaper_description">Live 60/120fps rolling odometer flip clock with milliseconds, Dark AMOLED, White, and Transparent modes.</string>
              <string name="widget_label">Flip Clock (Tap for Live 120fps)</string>
          </resources>
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/wallpaper_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description"
              android:settingsActivity="com.realme.flipclock.MainActivity"
              android:thumbnail="@drawable/ic_launcher" />
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/flip_widget_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:minResizeWidth="180dp"
              android:minResizeHeight="80dp"
              android:maxResizeWidth="800dp"
              android:maxResizeHeight="500dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_flip"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/wallpaper_description" />
          EOF_FILE

          mkdir -p "app/src/main/res/layout"
          cat << 'EOF_FILE' > "app/src/main/res/layout/widget_flip.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="4dp">
          
              <ImageView
                  android:id="@+id/widget_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"
                  android:contentDescription="@string/app_name" />
          </FrameLayout>
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M18,0 L90,0 A18,18 0 0,1 108,18 L108,90 A18,18 0 0,1 90,108 L18,108 A18,18 0 0,1 0,90 L0,18 A18,18 0 0,1 18,0 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M14,26 L50,26 A6,6 0 0,1 56,32 L56,76 A6,6 0 0,1 50,82 L14,82 A6,6 0 0,1 8,76 L8,32 A6,6 0 0,1 14,26 Z" />
              <path
                  android:fillColor="#1F1F23"
                  android:pathData="M64,26 L94,26 A6,6 0 0,1 100,32 L100,76 A6,6 0 0,1 94,82 L64,82 A6,6 0 0,1 58,76 L58,32 A6,6 0 0,1 64,26 Z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M24,40 L24,68 M40,40 L40,68 M72,40 L86,40 L86,54 L72,54 L72,68 L86,68" />
              <path
                  android:strokeColor="#000000"
                  android:strokeWidth="2"
                  android:pathData="M8,54 L100,54" />
          </vector>
          EOF_FILE

          mkdir -p "app/src/main/java/com/realme/flipclock"
          cat << 'EOF_FILE' > "app/src/main/java/com/realme/flipclock/ClockPrefs.java"
          package com.realme.flipclock;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          
          public class ClockPrefs {
          
              public static final String PREFS_NAME = "FlipOdometerPrefs";
              public static final String KEY_THEME_MODE = "theme_mode";
              public static final String KEY_SHOW_MS_BOX = "show_ms_box";
              public static final String KEY_USE_24H = "use_24h";
              public static final String KEY_VERTICAL_POS = "vertical_pos";
          
              public static final int MODE_AMOLED_DARK = 0;
              public static final int MODE_WHITE_LIGHT = 1;
              public static final int MODE_TRANS_LIGHT_TEXT = 2;
              public static final int MODE_TRANS_DARK_TEXT = 3;
          
              public static final int POS_TOP_WIDGET = 0;
              public static final int POS_CENTER = 1;
              public static final int POS_BOTTOM = 2;
          
              public static int getThemeMode(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getInt(KEY_THEME_MODE, MODE_AMOLED_DARK);
              }
          
              public static void setThemeMode(Context context, int mode) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putInt(KEY_THEME_MODE, (mode % 4 + 4) % 4)
                          .apply();
              }
          
              public static int cycleThemeMode(Context context) {
                  int next = (getThemeMode(context) + 1) % 4;
                  setThemeMode(context, next);
                  return next;
              }
          
              public static boolean isShowMsBox(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getBoolean(KEY_SHOW_MS_BOX, true);
              }
          
              public static void setShowMsBox(Context context, boolean show) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putBoolean(KEY_SHOW_MS_BOX, show)
                          .apply();
              }
          
              public static boolean isUse24Hour(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getBoolean(KEY_USE_24H, false);
              }
          
              public static void setUse24Hour(Context context, boolean use24h) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putBoolean(KEY_USE_24H, use24h)
                          .apply();
              }
          
              public static int getVerticalPos(Context context) {
                  SharedPreferences p = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  return p.getInt(KEY_VERTICAL_POS, POS_TOP_WIDGET);
              }
          
              public static void setVerticalPos(Context context, int pos) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                          .edit()
                          .putInt(KEY_VERTICAL_POS, pos)
                          .apply();
              }
          }
          EOF_FILE

          mkdir -p "app/src/main/java/com/realme/flipclock"
          cat << 'EOF_FILE' > "app/src/main/java/com/realme/flipclock/FlipOdometerRenderer.java"
          package com.realme.flipclock;
          
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PorterDuff;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import java.util.Calendar;
          
          public class FlipOdometerRenderer {
          
              private final Paint cardPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint borderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint splitLinePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint digitPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
              private final Paint badgePaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
              private final Paint shadePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF tempRect = new RectF();
              private final Path clipPath = new Path();
              private final Typeface condensedBold;
              private final Typeface sansBold;
          
              public FlipOdometerRenderer() {
                  condensedBold = Typeface.create("sans-serif-condensed", Typeface.BOLD);
                  sansBold = Typeface.create("sans-serif", Typeface.BOLD);
                  digitPaint.setTypeface(condensedBold);
                  digitPaint.setTextAlign(Paint.Align.CENTER);
                  badgePaint.setTypeface(sansBold);
                  badgePaint.setTextAlign(Paint.Align.LEFT);
                  borderPaint.setStyle(Paint.Style.STROKE);
              }
          
              public void drawClock(
                      Canvas canvas,
                      int width,
                      int height,
                      long nowMillis,
                      int themeMode,
                      boolean showMsBox,
                      boolean use24Hour,
                      int verticalPos,
                      boolean fillBackground,
                      float pixelShiftX,
                      float pixelShiftY
              ) {
                  if (width <= 0 || height <= 0) {
                      return;
                  }
          
                  // 1. Background handling for AMOLED Dark, White, and Transparent modes
                  if (fillBackground) {
                      if (themeMode == ClockPrefs.MODE_AMOLED_DARK) {
                          canvas.drawColor(Color.BLACK);
                      } else if (themeMode == ClockPrefs.MODE_WHITE_LIGHT) {
                          canvas.drawColor(Color.parseColor("#F2F2F7"));
                      } else if (themeMode == ClockPrefs.MODE_TRANS_LIGHT_TEXT) {
                          canvas.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR);
                      } else {
                          canvas.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR);
                      }
                  }
          
                  // Palette selection
                  int cardTopColor;
                  int cardBottomColor;
                  int borderColor;
                  int digitColor;
                  int splitLineColor;
                  int drumShadowEdgeColor;
          
                  switch (themeMode) {
                      case ClockPrefs.MODE_WHITE_LIGHT:
                          cardTopColor = Color.parseColor("#FFFFFF");
                          cardBottomColor = Color.parseColor("#E6E6EB");
                          borderColor = Color.parseColor("#D1D1D6");
                          digitColor = Color.parseColor("#18181B");
                          splitLineColor = Color.parseColor("#C7C7CC");
                          drumShadowEdgeColor = Color.argb(190, 210, 210, 218);
                          break;
                      case ClockPrefs.MODE_TRANS_LIGHT_TEXT:
                          cardTopColor = Color.argb(115, 24, 24, 28);
                          cardBottomColor = Color.argb(145, 12, 12, 16);
                          borderColor = Color.argb(110, 255, 255, 255);
                          digitColor = Color.parseColor("#F4F4F6");
                          splitLineColor = Color.argb(140, 0, 0, 0);
                          drumShadowEdgeColor = Color.argb(180, 10, 10, 14);
                          break;
                      case ClockPrefs.MODE_TRANS_DARK_TEXT:
                          cardTopColor = Color.argb(135, 255, 255, 255);
                          cardBottomColor = Color.argb(165, 230, 230, 238);
                          borderColor = Color.argb(120, 24, 24, 27);
                          digitColor = Color.parseColor("#141417");
                          splitLineColor = Color.argb(120, 160, 160, 170);
                          drumShadowEdgeColor = Color.argb(170, 225, 225, 232);
                          break;
                      case ClockPrefs.MODE_AMOLED_DARK:
                      default:
                          cardTopColor = Color.parseColor("#202023");
                          cardBottomColor = Color.parseColor("#121214");
                          borderColor = Color.parseColor("#2C2C2F");
                          digitColor = Color.parseColor("#DCDCE0");
                          splitLineColor = Color.parseColor("#000000");
                          drumShadowEdgeColor = Color.argb(235, 8, 8, 10);
                          break;
                  }
          
                  // 2. Compute exact time and geared odometer fractional roll (0.0 -> 1.0)
                  Calendar cal = Calendar.getInstance();
                  cal.setTimeInMillis(nowMillis);
          
                  int ms = cal.get(Calendar.MILLISECOND); // 0..999
                  int sec = cal.get(Calendar.SECOND);     // 0..59
                  int min = cal.get(Calendar.MINUTE);     // 0..59
                  int hour24 = cal.get(Calendar.HOUR_OF_DAY); // 0..23
          
                  boolean isPm = (hour24 >= 12);
                  int hourCurr = use24Hour ? hour24 : (hour24 % 12 == 0 ? 12 : hour24 % 12);
                  int nextHour24 = (hour24 + 1) % 24;
                  int hourNext = use24Hour ? nextHour24 : (nextHour24 % 12 == 0 ? 12 : nextHour24 % 12);
          
                  // Fast-rolling milliseconds/centiseconds (00..99)
                  int cs = ms / 10; // 0..99
                  float csOnesFrac = (ms % 10) / 10.0f;
                  int csOnesCurr = cs % 10;
                  int csOnesNext = (csOnesCurr + 1) % 10;
          
                  int csTensCurr = cs / 10;
                  int csTensNext = (csTensCurr + 1) % 10;
                  float csTensFrac = (ms % 100) / 100.0f; // Smooth continuous 10 digits/sec roll
          
                  // Seconds (00..59) driven by milliseconds
                  int secOnesCurr = sec % 10;
                  int secOnesNext = (secOnesCurr + 1) % 10;
                  float secOnesFrac;
                  if (showMsBox) {
                      // When MS box is visible, MS tenths (7..9) gears into Seconds Ones smoothly
                      if (ms >= 700) {
                          secOnesFrac = smoothStep((ms - 700) / 300.0f);
                      } else {
                          secOnesFrac = 0.0f;
                      }
                  } else {
                      // In 3-Box mode, Seconds Ones rolls continuously driven by milliseconds
                      secOnesFrac = ms / 1000.0f;
                  }
          
                  int secTensCurr = sec / 10;
                  int secTensNext = (secTensCurr + 1) % 6;
                  float secTensFrac = (secOnesCurr == 9) ? secOnesFrac : 0.0f;
          
                  // Minutes (00..59) geared to Seconds rollover (59 -> 00)
                  int minOnesCurr = min % 10;
                  int minOnesNext = (minOnesCurr + 1) % 10;
                  float minOnesFrac = (sec == 59) ? secTensFrac : 0.0f;
          
                  int minTensCurr = min / 10;
                  int minTensNext = (minTensCurr + 1) % 6;
                  float minTensFrac = (minOnesCurr == 9) ? minOnesFrac : 0.0f;
          
                  // Hours geared to Minutes rollover (59:59 -> 00:00)
                  float hourCarryFrac = (min == 59 && sec == 59) ? minTensFrac : 0.0f;
                  int hOnesCurr = hourCurr % 10;
                  int hOnesNext = hourNext % 10;
                  float hOnesFrac = (hOnesCurr != hOnesNext) ? hourCarryFrac : 0.0f;
          
                  int hTensCurr = hourCurr / 10;
                  int hTensNext = hourNext / 10;
                  float hTensFrac = (hTensCurr != hTensNext) ? hourCarryFrac : 0.0f;
          
                  // 3. Layout geometry matching 1000386934.jpg proportions (Hour Card + Minute Card + Right Small Card(s))
                  // Total horizontal aspect ratio of [BigCard] [gap] [BigCard] [gap] [SmallCard] is 1.0 + 0.06 + 1.0 + 0.06 + 0.54 = 2.66 units wide by 1.04 units tall
                  float availW = width * 0.92f;
                  float availH = height * 0.82f;
                  float unitByW = availW / 2.66f;
                  float unitByH = availH / 1.05f;
                  float bigCardW = Math.min(unitByW, unitByH);
                  float bigCardH = bigCardW * 1.04f;
                  float gap = bigCardW * 0.055f;
                  float smallCardW = bigCardW * 0.55f;
                  float smallCardH = showMsBox ? (bigCardH - gap) * 0.50f : bigCardH * 0.48f;
          
                  float totalW = bigCardW * 2.0f + smallCardW + gap * 2.0f;
                  float startX = (width - totalW) * 0.5f + pixelShiftX;
          
                  float centerY;
                  if (verticalPos == ClockPrefs.POS_TOP_WIDGET) {
                      centerY = Math.max(bigCardH * 0.68f, height * 0.28f) + pixelShiftY;
                  } else if (verticalPos == ClockPrefs.POS_BOTTOM) {
                      centerY = Math.min(height - bigCardH * 0.68f, height * 0.72f) + pixelShiftY;
                  } else {
                      centerY = height * 0.50f + pixelShiftY;
                  }
                  float topY = centerY - bigCardH * 0.5f;
          
                  // Draw Card 1: Hours (Large Left)
                  String amPmBadge = use24Hour ? null : (isPm ? "PM" : "AM");
                  drawOdometerCard(
                          canvas,
                          startX,
                          topY,
                          bigCardW,
                          bigCardH,
                          hTensCurr, hTensNext, hTensFrac,
                          hOnesCurr, hOnesNext, hOnesFrac,
                          amPmBadge,
                          cardTopColor, cardBottomColor, borderColor, digitColor, splitLineColor, drumShadowEdgeColor
                  );
          
                  // Draw Card 2: Minutes (Large Middle)
                  float minX = startX + bigCardW + gap;
                  drawOdometerCard(
                          canvas,
                          minX,
                          topY,
                          bigCardW,
                          bigCardH,
                          minTensCurr, minTensNext, minTensFrac,
                          minOnesCurr, minOnesNext, minOnesFrac,
                          null,
                          cardTopColor, cardBottomColor, borderColor, digitColor, splitLineColor, drumShadowEdgeColor
                  );
          
                  // Draw Right Card(s): Seconds (+ Fast Milliseconds if enabled)
                  float rightX = minX + bigCardW + gap;
                  if (showMsBox) {
                      // Top-Right Small Card: Seconds
                      drawOdometerCard(
                              canvas,
                              rightX,
                              topY,
                              smallCardW,
                              smallCardH,
                              secTensCurr, secTensNext, secTensFrac,
                              secOnesCurr, secOnesNext, secOnesFrac,
                              null,
                              cardTopColor, cardBottomColor, borderColor, digitColor, splitLineColor, drumShadowEdgeColor
                      );
                      // Bottom-Right Small Card: Fast-Rolling Centiseconds/Microseconds
                      float msY = topY + bigCardH - smallCardH;
                      drawOdometerCard(
                              canvas,
                              rightX,
                              msY,
                              smallCardW,
                              smallCardH,
                              csTensCurr, csTensNext, csTensFrac,
                              csOnesCurr, csOnesNext, csOnesFrac,
                              null,
                              cardTopColor, cardBottomColor, borderColor, digitColor, splitLineColor, drumShadowEdgeColor
                      );
                  } else {
                      // Classic 1000386934.jpg Bottom-Right Small Card: Continuous Rolling Seconds
                      float secY = topY + bigCardH - smallCardH;
                      drawOdometerCard(
                              canvas,
                              rightX,
                              secY,
                              smallCardW,
                              smallCardH,
                              secTensCurr, secTensNext, secTensFrac,
                              secOnesCurr, secOnesNext, secOnesFrac,
                              null,
                              cardTopColor, cardBottomColor, borderColor, digitColor, splitLineColor, drumShadowEdgeColor
                      );
                  }
              }
          
              private void drawOdometerCard(
                      Canvas canvas,
                      float x,
                      float y,
                      float w,
                      float h,
                      int d1Curr, int d1Next, float d1Frac,
                      int d2Curr, int d2Next, float d2Frac,
                      String badgeText,
                      int cardTopColor,
                      int cardBottomColor,
                      int borderColor,
                      int digitColor,
                      int splitLineColor,
                      int drumShadowEdgeColor
              ) {
                  float radius = Math.min(w, h) * 0.085f;
                  tempRect.set(x, y, x + w, y + h);
          
                  // 1. Draw rounded card background with subtle vertical flip-flap sheen
                  LinearGradient cardGrad = new LinearGradient(
                          x, y, x, y + h,
                          cardTopColor, cardBottomColor,
                          Shader.TileMode.CLAMP
                  );
                  cardPaint.setShader(cardGrad);
                  canvas.drawRoundRect(tempRect, radius, radius, cardPaint);
                  cardPaint.setShader(null);
          
                  // 2. Clip strictly to the rounded card interior for the rolling drum digits
                  canvas.save();
                  clipPath.reset();
                  clipPath.addRoundRect(tempRect, radius, radius, Path.Direction.CW);
                  canvas.clipPath(clipPath);
          
                  float cy = y + h * 0.5f;
                  float d1Cx = x + w * 0.305f;
                  float d2Cx = x + w * 0.695f;
                  float textSize = h * 0.72f;
                  digitPaint.setTextSize(textSize);
          
                  drawRollingWheelDigit(canvas, d1Cx, cy, h, d1Curr, d1Next, d1Frac, digitColor);
                  drawRollingWheelDigit(canvas, d2Cx, cy, h, d2Curr, d2Next, d2Frac, digitColor);
          
                  // 3. Draw top and bottom cylindrical drum shadows (matching 1000386932.mp4 depth)
                  float shadeH = h * 0.28f;
                  LinearGradient topShade = new LinearGradient(
                          x, y, x, y + shadeH,
                          drumShadowEdgeColor, Color.TRANSPARENT,
                          Shader.TileMode.CLAMP
                  );
                  shadePaint.setShader(topShade);
                  canvas.drawRect(x, y, x + w, y + shadeH, shadePaint);
          
                  LinearGradient botShade = new LinearGradient(
                          x, y + h - shadeH, x, y + h,
                          Color.TRANSPARENT, drumShadowEdgeColor,
                          Shader.TileMode.CLAMP
                  );
                  shadePaint.setShader(botShade);
                  canvas.drawRect(x, y + h - shadeH, x + w, y + h, shadePaint);
                  shadePaint.setShader(null);
          
                  // 4. Draw horizontal split-flap crease across exact vertical center (matching 1000386934.jpg)
                  splitLinePaint.setColor(splitLineColor);
                  splitLinePaint.setStrokeWidth(Math.max(2.0f, h * 0.012f));
                  canvas.drawLine(x, cy, x + w, cy, splitLinePaint);
          
                  // 5. Optional AM/PM badge in bottom-left corner of Hours card
                  if (badgeText != null) {
                      badgePaint.setColor(digitColor);
                      badgePaint.setAlpha(200);
                      badgePaint.setTextSize(h * 0.095f);
                      canvas.drawText(badgeText, x + w * 0.065f, y + h * 0.92f, badgePaint);
                  }
          
                  canvas.restore();
          
                  // 6. Subtle outer card border
                  borderPaint.setColor(borderColor);
                  borderPaint.setStrokeWidth(Math.max(1.5f, h * 0.006f));
                  canvas.drawRoundRect(tempRect, radius, radius, borderPaint);
              }
          
              private void drawRollingWheelDigit(
                      Canvas canvas,
                      float cx,
                      float cy,
                      float cardH,
                      int currDigit,
                      int nextDigit,
                      float frac,
                      int digitColor
              ) {
                  Paint.FontMetrics fm = digitPaint.getFontMetrics();
                  float textOffset = (fm.ascent + fm.descent) * 0.5f;
                  float rollDistance = cardH * 0.78f;
          
                  // Current digit rolls UP as frac goes 0.0 -> 1.0
                  float yCurr = cy - (frac * rollDistance);
                  float distCurr = Math.abs(yCurr - cy) / (cardH * 0.5f);
                  int alphaCurr = Math.max(0, Math.min(255, (int) (255.0f * (1.0f - 0.65f * distCurr))));
          
                  digitPaint.setColor(digitColor);
                  digitPaint.setAlpha(alphaCurr);
                  canvas.drawText(String.valueOf(currDigit), cx, yCurr - textOffset, digitPaint);
          
                  // Next digit rolls UP from below
                  if (frac > 0.002f) {
                      float yNext = cy + ((1.0f - frac) * rollDistance);
                      float distNext = Math.abs(yNext - cy) / (cardH * 0.5f);
                      int alphaNext = Math.max(0, Math.min(255, (int) (255.0f * (1.0f - 0.65f * distNext))));
                      digitPaint.setColor(digitColor);
                      digitPaint.setAlpha(alphaNext);
                      canvas.drawText(String.valueOf(nextDigit), cx, yNext - textOffset, digitPaint);
                  }
              }
          
              private float smoothStep(float t) {
                  if (t <= 0.0f) return 0.0f;
                  if (t >= 1.0f) return 1.0f;
                  return t * t * (3.0f - 2.0f * t);
              }
          }
